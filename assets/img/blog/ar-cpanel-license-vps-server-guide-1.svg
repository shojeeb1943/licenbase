<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t13 d13">
  <title id="t13">اختيار ترخيص cPanel منخفض التكلفة لخادم VPS</title>
  <desc id="d13">مقارنة باقات ترخيص cPanel لخوادم VPS والتفعيل الفوري عبر عنوان IP.</desc>
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="480" y="55" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700" fill="#38BDF8" text-anchor="middle">أفضل طرق اختيار ترخيص cPanel منخفض التكلفة لخادم VPS</text>

  <!-- Card 1: Solo -->
  <rect x="45" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="45" y="85" width="265" height="6" rx="3" fill="#38BDF8"/>
  <text x="177" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">cPanel Solo</text>
  <text x="177" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">حساب واحد (1)</text>
  <line x1="65" y1="175" x2="290" y2="175" stroke="#334155"/>
  <text x="270" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">مناسب للمتاجر الإلكترونية</text>
  <text x="270" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">خوادم الاستضافة الفردية</text>
  <text x="270" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">تحديثات مباشرة ومستمرة</text>
  <rect x="65" y="305" width="225" height="40" rx="6" fill="#1E293B"/>
  <text x="177" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">LicenBase: 4$ / شهرياً</text>

  <!-- Card 2: Admin -->
  <rect x="345" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <rect x="345" y="85" width="265" height="6" rx="3" fill="#10B981"/>
  <text x="477" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle">cPanel Admin (الأكثر طلباً)</text>
  <text x="477" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle">حتى 5 حسابات</text>
  <line x1="365" y1="175" x2="590" y2="175" stroke="#334155"/>
  <text x="570" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">مثالي للشركات والوكالات</text>
  <text x="570" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">لوحة تحكم WHM كاملة</text>
  <text x="570" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">شهادات SSL تلقائية</text>
  <rect x="365" y="305" width="225" height="40" rx="6" fill="#10B981"/>
  <text x="477" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">LicenBase: 4$ / شهرياً</text>

  <!-- Card 3: Pro -->
  <rect x="645" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="645" y="85" width="265" height="6" rx="3" fill="#818CF8"/>
  <text x="777" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">cPanel Pro</text>
  <text x="777" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#818CF8" text-anchor="middle">حتى 30 حساباً</text>
  <line x1="665" y1="175" x2="890" y2="175" stroke="#334155"/>
  <text x="870" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">لموزعي الاستضافة Reseller</text>
  <text x="870" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">تفعيل فوري عبر IP السيرفر</text>
  <text x="870" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">أمان واستقرار 100%</text>
  <rect x="665" y="305" width="225" height="40" rx="6" fill="#1E293B"/>
  <text x="777" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#818CF8" text-anchor="middle">LicenBase: 4$ / شهرياً</text>
</svg>