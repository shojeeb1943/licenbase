<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg9)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">5 Strategies to Defeat Annual cPanel Price Increases</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Tactical roadmap for web hosts, sysadmins, and agencies to compress monthly server licensing costs</text>

  <!-- 5 Cards Layout -->
  <!-- Card 1 -->
  <rect x="50" y="125" width="165" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="165" height="35" rx="10" fill="#0284c7"/>
  <text x="132" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Wholesale Pricing</text>
  <text x="65" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Switch to LicenBase</text>
  <text x="65" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• IP-based automated licensing</text>
  <text x="65" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Up to 60% lower than retail rates</text>
  <text x="65" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Instant Activation</text>

  <!-- Card 2 -->
  <rect x="225" y="125" width="165" height="230" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="225" y="125" width="165" height="35" rx="10" fill="#059669"/>
  <text x="307" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Account Pruning</text>
  <text x="240" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Merge Inactive Accts</text>
  <text x="240" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Convert low sites to addon domains</text>
  <text x="240" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Avoid per-account threshold fees</text>
  <text x="240" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Drop Tier Brackets</text>

  <!-- Card 3 -->
  <rect x="400" y="125" width="165" height="230" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="400" y="125" width="165" height="35" rx="10" fill="#d97706"/>
  <text x="482" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Multi-Node Fleet</text>
  <text x="415" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Split Across VPS</text>
  <text x="415" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Two 50-acct Pro tiers</text>
  <text x="415" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Cheaper than single 250+ Premier</text>
  <text x="415" y="325" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Hardware &amp; Cost ROI</text>

  <!-- Card 4 -->
  <rect x="575" y="125" width="165" height="230" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="575" y="125" width="165" height="35" rx="10" fill="#4338ca"/>
  <text x="657" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Modern Panels</text>
  <text x="590" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">DirectAdmin &amp; Webuzo</text>
  <text x="590" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Flat monthly fee per server</text>
  <text x="590" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Unlimited users without penalties</text>
  <text x="590" y="325" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Zero Lock-In</text>

  <!-- Card 5 -->
  <rect x="750" y="125" width="160" height="230" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="750" y="125" width="160" height="35" rx="10" fill="#be185d"/>
  <text x="830" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5. Managed VPS</text>
  <text x="765" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Bundled Licensing</text>
  <text x="765" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• License included in hardware price</text>
  <text x="765" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 24/7 sysadmin patching &amp; care</text>
  <text x="765" y="325" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">All-Inclusive SLA</text>
</svg>
