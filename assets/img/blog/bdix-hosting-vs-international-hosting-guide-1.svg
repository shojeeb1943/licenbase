<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">BDIX Hosting vs International Hosting Network Architecture</title>
  <desc id="d">Network latency and bandwidth routing comparison between Bangladesh Internet Exchange (BDIX) local peering and international subsea transit.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Network Routing: BDIX Local Peering vs International Transit</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#10B981">Latency Analysis</text>

  <!-- Left: BDIX Local Peering -->
  <g transform="translate(35, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#10B981"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10B981">BDIX Local Peering (Sub-5ms Latency)</text>
    <text x="25" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Domestic traffic routed entirely within Bangladesh ISP networks</text>
    <path d="M25 76 h380" stroke="#334155" stroke-width="1"/>
    <text x="25" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Network Latency: 2ms - 8ms nationwide across all ISPs</text>
    <text x="25" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Throughput: Unmetered 10Gbps direct fiber exchange pipes</text>
    <text x="25" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Cable Cut Immune: Unaffected by submarine cable disruptions</text>
    <text x="25" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Ideal Audience: Local e-commerce, media portals, school portals</text>
    <rect x="25" y="226" width="380" height="38" rx="8" fill="#0F172A"/>
    <text x="215" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">Average Round-Trip Ping: 4 ms</text>
  </g>

  <!-- Right: International Hosting -->
  <g transform="translate(495, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#38BDF8"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">International Hosting (Singapore / USA / EU)</text>
    <text x="25" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Traffic traverses international undersea fiber cables (SEA-ME-WE)</text>
    <path d="M25 76 h380" stroke="#334155" stroke-width="1"/>
    <text x="25" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✖ Domestic Latency: 45ms (Singapore) to 180ms - 240ms (USA/EU)</text>
    <text x="25" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Global Reach: High-speed edge routing for international clients</text>
    <text x="25" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✖ Cable Vulnerability: Latency spikes during subsea maintenance</text>
    <text x="25" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Ideal Audience: Global SaaS, export businesses, affiliate blogs</text>
    <rect x="25" y="226" width="380" height="38" rx="8" fill="#0F172A"/>
    <text x="215" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Average Round-Trip Ping: 65 - 190 ms</text>
  </g>
</svg>