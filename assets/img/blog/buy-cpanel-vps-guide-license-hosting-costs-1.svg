<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Buy cPanel VPS Cost Breakdown</title>
  <desc id="d">Comparing the total cost of ownership between bundled managed cPanel VPS and unbundled self-managed setup.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Model A: Managed Bundled VPS -->
  <rect x="40" y="40" width="420" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="40" width="420" height="6" rx="3" fill="#64748B"/>
  <text x="65" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Option A: Bundled Managed cPanel VPS</text>
  <text x="65" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748B">Turnkey Host Package (4GB RAM VPS)</text>
  <path d="M65 120 h370" stroke="#F1F5F9" stroke-width="1"/>
  
  <text x="65" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Base VPS Cloud Infrastructure: $25.00/mo</text>
  <text x="65" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Retail cPanel Admin License Markup: $28.00/mo</text>
  <text x="65" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Mandatory Management Addon: $15.00/mo</text>
  <text x="65" y="255" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Total Monthly Cost: ~$68.00 / month</text>
  
  <rect x="65" y="295" width="370" height="45" rx="8" fill="#F1F5F9"/>
  <text x="250" y="323" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Annual Cost: $816.00 / yr</text>

  <!-- Model B: Unbundled VPS + LicenBase -->
  <rect x="500" y="40" width="420" height="340" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="500" y="40" width="420" height="6" rx="3" fill="#2563EB"/>
  <text x="525" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Option B: Unbundled VPS + LicenBase</text>
  <text x="525" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Hetzner / Vultr / DigitalOcean + LicenBase</text>
  <path d="M525 120 h370" stroke="#EFF6FF" stroke-width="1"/>
  
  <text x="525" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Fast Cloud VPS (4GB RAM, NVMe): ~$12.00/mo</text>
  <text x="525" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• LicenBase cPanel Automated License: $4.00/mo</text>
  <text x="525" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• 1-Click OS &amp; Script Installer (Softaculous): $1.50/mo</text>
  <text x="525" y="255" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#059669">Total Monthly Cost: ~$17.50 / month</text>
  
  <rect x="525" y="295" width="370" height="45" rx="8" fill="#ECFDF5"/>
  <text x="710" y="323" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Annual Cost: $210.00 / yr (Save 74%)</text>
</svg>