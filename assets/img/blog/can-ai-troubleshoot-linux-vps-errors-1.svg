<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bg13)"/>
  <text x="400" y="45" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" text-anchor="middle">AI-Assisted Linux VPS Sysadmin Workflow</text>
  <text x="400" y="72" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">Prompt Sanitization, Log Ingestion, Root Execution Guardrails</text>

  <rect x="50" y="105" width="210" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="155" y="140" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Safe Extraction</text>
  <text x="155" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Sanitize Sensitive Logs</text>
  <line x1="70" y1="180" x2="240" y2="180" stroke="#334155"/>
  <text x="70" y="210" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Mask public IPs</text>
  <text x="70" y="235" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Redact passwords &amp; tokens</text>
  <text x="70" y="260" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Tail last 50 error lines</text>
  <text x="70" y="285" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Strip private paths</text>
  <rect x="70" y="325" width="170" height="32" rx="6" fill="#0284c7" fill-opacity="0.2"/>
  <text x="155" y="346" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Sanitized</text>

  <rect x="295" y="105" width="210" height="270" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="140" fill="#c084fc" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. AI Diagnosis</text>
  <text x="400" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Pattern Recognition</text>
  <line x1="315" y1="180" x2="485" y2="180" stroke="#334155"/>
  <text x="315" y="210" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Correlate stack traces</text>
  <text x="315" y="235" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Identify memory exhaustion</text>
  <text x="315" y="260" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Spot config syntax typos</text>
  <text x="315" y="285" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Propose fix steps</text>
  <rect x="315" y="325" width="170" height="32" rx="6" fill="#a855f7" fill-opacity="0.2"/>
  <text x="400" y="346" fill="#c084fc" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Root Cause Isolated</text>

  <rect x="540" y="105" width="210" height="270" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="645" y="140" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Human Review</text>
  <text x="645" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Execution Guardrails</text>
  <line x1="560" y1="180" x2="730" y2="180" stroke="#334155"/>
  <text x="560" y="210" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">✓ Never blind-paste rm -rf</text>
  <text x="560" y="235" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">✓ Test in staging / dry-run</text>
  <text x="560" y="260" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">✓ Take snapshot backup</text>
  <text x="560" y="285" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">✓ Verify service status</text>
  <rect x="560" y="325" width="170" height="32" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="645" y="346" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Safe Remediation</text>
