<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PANDUAN PERBAIKAN AUTOSSL CPANEL</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Mengatasi Gagal Validasi DCV &amp; Propagasi DNS di VPS</text>

  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Penyebab Error</text>
  <text x="60" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• IP DNS Record tidak cocok</text>
  <text x="60" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Rewrite rule .htaccess blokir DCV</text>
  <text x="60" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Cloudflare Proxy aktif saat cek</text>
  <text x="60" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Batas limit Sectigo tercapai</text>

  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Pengecekan Terminal</text>
  <text x="310" y="175" fill="#94a3b8" font-family="monospace" font-size="10">dig +short DOMAIN.COM</text>
  <text x="310" y="195" fill="#94a3b8" font-family="monospace" font-size="10">/usr/local/cpanel/bin/autossl_check</text>
  <text x="310" y="210" fill="#94a3b8" font-family="monospace" font-size="10">--user=USER</text>
  <text x="310" y="230" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Periksa respons HTTP-01</text>

  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Solusi &amp; Sertifikat</text>
  <text x="560" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Bypass folder .well-known</text>
  <text x="560" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Ganti ke Let's Encrypt</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Perbaiki rDNS &amp; A Record</text>
  <text x="560" y="235" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ HTTPS Aktif Otomatis</text>

  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Perintah Khusus Let's Encrypt Plugin di WHM:</text>
  <text x="60" y="340" fill="#38bdf8" font-family="monospace" font-size="12">/scripts/install_lets_encrypt_autossl_provider</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Memasang provider Let's Encrypt resmi di cPanel untuk penerbitan SSL instan tak terbatas.</text>
</svg>