<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t2 d2">
  <title id="t2">CloudLinux OS Architecture and Tenant Isolation on cPanel VPS</title>
  <desc id="d2">How CloudLinux LVE limits, CageFS, and MySQL Governor prevent shared hosting resource spikes.</desc>
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="480" y="60" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#38BDF8" text-anchor="middle">CloudLinux OS Tenant Isolation on cPanel VPS</text>

  <!-- Left: Shared Tenant without CloudLinux -->
  <rect x="40" y="90" width="410" height="280" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="245" y="125" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#F87171" text-anchor="middle">Standard Linux (AlmaLinux / CentOS)</text>
  <rect x="60" y="145" width="370" height="60" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="75" y="170" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FCA5A5">Tenant A: Traffic Spike / Rogue Script</text>
  <text x="75" y="192" font-family="Inter, sans-serif" font-size="12" fill="#FECACA">Consumes 98% CPU &amp; 100% RAM &rarr; MySQL Crashes</text>
  
  <rect x="60" y="215" width="175" height="50" rx="6" fill="#1E293B"/>
  <text x="147" y="238" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Tenant B</text>
  <text x="147" y="254" font-family="Inter, sans-serif" font-size="11" fill="#EF4444" text-anchor="middle">503 Service Down</text>

  <rect x="255" y="215" width="175" height="50" rx="6" fill="#1E293B"/>
  <text x="342" y="238" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Tenant C</text>
  <text x="342" y="254" font-family="Inter, sans-serif" font-size="11" fill="#EF4444" text-anchor="middle">Slow Response Time</text>

  <rect x="60" y="280" width="370" height="70" rx="6" fill="#18181B"/>
  <text x="245" y="310" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#F87171" text-anchor="middle">No Kernel Isolation &bull; Shared Fate</text>
  <text x="245" y="330" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">One bad neighbor knocks down the entire VPS</text>

  <!-- Right: With CloudLinux LVE & CageFS -->
  <rect x="490" y="90" width="430" height="280" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="705" y="125" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">CloudLinux OS (LVE Manager + CageFS)</text>

  <rect x="510" y="145" width="390" height="60" rx="6" fill="#064E3B" stroke="#059669"/>
  <text x="525" y="170" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">Tenant A: Traffic Spike Contained in LVE</text>
  <text x="525" y="192" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">Throttled to 1 Core / 1GB RAM max &bull; Server Safe</text>

  <rect x="510" y="215" width="185" height="50" rx="6" fill="#064E3B"/>
  <text x="602" y="238" font-family="Inter, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Tenant B: Isolated</text>
  <text x="602" y="254" font-family="Inter, sans-serif" font-size="11" fill="#34D399" text-anchor="middle">100% Fast &amp; Online</text>

  <rect x="715" y="215" width="185" height="50" rx="6" fill="#064E3B"/>
  <text x="807" y="238" font-family="Inter, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Tenant C: CageFS Safe</text>
  <text x="807" y="254" font-family="Inter, sans-serif" font-size="11" fill="#34D399" text-anchor="middle">No Cross-Site Hacks</text>

  <rect x="510" y="280" width="390" height="70" rx="6" fill="#18181B"/>
  <text x="705" y="310" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">Virtualised User Environments (LVE)</text>
  <text x="705" y="330" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Strict memory, CPU, IOPS, and MySQL limits per tenant</text>
</svg>