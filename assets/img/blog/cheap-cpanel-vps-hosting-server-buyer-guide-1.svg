<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t4 d4">
  <title id="t4">cPanel VPS Hardware Requirements and Provider Architecture</title>
  <desc id="d4">Recommended CPU, RAM, NVMe, and network specs for budget cPanel VPS hosting.</desc>
  <rect width="960" height="420" rx="16" fill="#0B132B"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#1C2541" stroke="#3A506B"/>
  <text x="480" y="60" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#6FFFE9" text-anchor="middle">How to Size a Budget cPanel VPS: Specs vs Account Load</text>

  <!-- Spec 1: Starter -->
  <rect x="40" y="90" width="265" height="280" rx="10" fill="#0B132B" stroke="#3A506B"/>
  <rect x="40" y="90" width="265" height="6" rx="3" fill="#48CAE4"/>
  <text x="172" y="125" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Entry VPS (1-5 Sites)</text>
  <text x="65" y="165" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 2 vCPU Cores (Dedicated share)</text>
  <text x="65" y="195" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 4 GB RAM (Min for smooth WHM)</text>
  <text x="65" y="225" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 50 GB NVMe SSD</text>
  <text x="65" y="255" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 1 Gbps Port / 20TB Transfer</text>
  <text x="65" y="285" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">&bull; AlmaLinux 9 / CloudLinux 9</text>
  <rect x="60" y="320" width="225" height="32" rx="6" fill="#1C2541"/>
  <text x="172" y="341" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#48CAE4" text-anchor="middle">VPS ~$5/mo + cPanel $4/mo</text>

  <!-- Spec 2: Agency Growth -->
  <rect x="335" y="85" width="280" height="290" rx="10" fill="#0F172A" stroke="#6FFFE9" stroke-width="2"/>
  <rect x="335" y="85" width="280" height="6" rx="3" fill="#6FFFE9"/>
  <text x="475" y="120" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agency VPS (10-30 Sites)</text>
  <text x="360" y="160" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">&bull; 4 vCPU Cores</text>
  <text x="360" y="190" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">&bull; 8 GB to 16 GB RAM</text>
  <text x="360" y="220" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">&bull; 120 GB NVMe Storage</text>
  <text x="360" y="250" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">&bull; LiteSpeed + LSCache enabled</text>
  <text x="360" y="280" font-family="Inter, sans-serif" font-size="13" fill="#6FFFE9">&bull; Automated JetBackup snapshots</text>
  <rect x="355" y="320" width="240" height="35" rx="6" fill="#6FFFE9"/>
  <text x="475" y="342" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Sweet Spot for Resellers</text>

  <!-- Spec 3: Heavy Shared -->
  <rect x="645" y="90" width="265" height="280" rx="10" fill="#0B132B" stroke="#3A506B"/>
  <rect x="645" y="90" width="265" height="6" rx="3" fill="#7209B7"/>
  <text x="777" y="125" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Multi-Tenant (50+ Sites)</text>
  <text x="670" y="165" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 8 vCPU Cores</text>
  <text x="670" y="195" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 32 GB RAM</text>
  <text x="670" y="225" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; 250 GB Enterprise NVMe</text>
  <text x="670" y="255" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; CloudLinux LVE Governance</text>
  <text x="670" y="285" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">&bull; Imunify360 AI WAF Firewall</text>
  <rect x="665" y="320" width="225" height="32" rx="6" fill="#1C2541"/>
  <text x="777" y="341" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Enterprise High-Density</text>
</svg>