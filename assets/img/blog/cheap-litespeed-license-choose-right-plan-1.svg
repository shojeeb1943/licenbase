<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Choosing the Right LiteSpeed License Plan</title>
  <desc id="d">Decision matrix for selecting LiteSpeed 2, 4, 8, or X Core licenses based on server workload.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="50" y="45" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="85" cy="80" r="18" fill="#EFF6FF"/>
  <text x="85" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">1</text>
  <text x="120" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2 Core ($4.00/mo)</text>
  <text x="120" y="105" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Best for 1-2 vCPU cloud instances hosting 10-30</text>
  <text x="120" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">standard WordPress or small WooCommerce sites.</text>

  <rect x="500" y="45" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="535" cy="80" r="18" fill="#EFF6FF"/>
  <text x="535" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">2</text>
  <text x="570" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">4 Core ($7.50/mo)</text>
  <text x="570" y="105" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Ideal for 4 vCPU production nodes with heavy</text>
  <text x="570" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">dynamic traffic, high-concurrency e-commerce.</text>

  <rect x="50" y="225" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="85" cy="260" r="18" fill="#EFF6FF"/>
  <text x="85" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">3</text>
  <text x="120" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">8 Core ($10.50/mo)</text>
  <text x="120" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Engineered for large VPS and dedicated nodes</text>
  <text x="120" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">hosting 100+ multi-tenant agency client sites.</text>

  <rect x="500" y="225" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="535" cy="260" r="18" fill="#ECFDF5"/>
  <text x="535" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">4</text>
  <text x="570" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">X Core ($11.50/mo)</text>
  <text x="570" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Unlimited CPU cores for top-tier bare-metal</text>
  <text x="570" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">servers and multi-core enterprise clusters.</text>
</svg>