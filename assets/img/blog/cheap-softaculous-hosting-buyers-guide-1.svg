<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cheap Softaculous Hosting Buyer Checklist</title>
  <desc id="d">Essential checklist of features to look for when choosing affordable Softaculous web hosting.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Col 1: Softaculous Free vs Pro -->
  <rect x="40" y="40" width="420" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="40" width="420" height="6" rx="3" fill="#F59E0B"/>
  <text x="65" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Softaculous Free vs Premium</text>
  <text x="65" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#D97706">Beware of Stripped-Down Free Editions</text>
  <path d="M65 120 h370" stroke="#F1F5F9" stroke-width="1"/>
  
  <text x="65" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569"><tspan font-weight="700" fill="#E11D48">Free Edition:</tspan> Only ~50 scripts, delayed updates, no staging</text>
  <text x="65" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569"><tspan font-weight="700" fill="#059669">Premium Edition:</tspan> 400+ scripts, 1-click WP staging &amp; cloning</text>
  <text x="65" y="230" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569"><tspan font-weight="700" fill="#2563EB">Auto Backup:</tspan> Automated snapshots before major core updates</text>
  
  <rect x="65" y="295" width="370" height="45" rx="8" fill="#FEF3C7"/>
  <text x="250" y="323" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Verify Host Offers Softaculous Pro</text>

  <!-- Col 2: Hosting Stack Checklist -->
  <rect x="500" y="40" width="420" height="340" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="500" y="40" width="420" height="6" rx="3" fill="#3B82F6"/>
  <text x="525" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Server Environment Checklist</text>
  <text x="525" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Crucial Server Specs for 1-Click Apps</text>
  <path d="M525 120 h370" stroke="#F1F5F9" stroke-width="1"/>
  
  <text x="525" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">✓ PHP 8.1, 8.2, 8.3 &amp; 8.4 Multi-Version Selector</text>
  <text x="525" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">✓ ionCube Loader &amp; cURL enabled by default</text>
  <text x="525" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">✓ LiteSpeed Web Server with LSCache support</text>
  <text x="525" y="255" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">✓ Free automated Let's Encrypt SSL provisioning</text>
  
  <rect x="525" y="295" width="370" height="45" rx="8" fill="#EFF6FF"/>
  <text x="710" y="323" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">Optimal Script Performance</text>
