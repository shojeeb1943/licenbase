<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" rx="16" fill="url(#bg)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="960" height="6" fill="url(#accentGrad)"/>

  <!-- Grid Decoration -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- Header Badge -->
  <rect x="48" y="32" width="220" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="158" y="49" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">SYSADMIN ACCESS PERMISSIONS</text>

  <!-- Title & Subtitle -->
  <text x="48" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Linux Chmod & Permissions Architecture Matrix</text>
  <text x="48" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Decoding octal bits, user/group/world permissions, and web server security hardening</text>

  <!-- 3 Main Architecture Cards -->
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="48" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="48" y="186" width="266" height="1" fill="#334155"/>
    <text x="68" y="172" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Octal Permission Bits</text>
    <g transform="translate(68, 212)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Read (r = 4): View Content</text>
      <circle cx="0" cy="46" r="4" fill="#38bdf8"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Write (w = 2): Modify Content</text>
      <circle cx="0" cy="92" r="4" fill="#38bdf8"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Execute (x = 1): Run Script</text>
      <circle cx="0" cy="138" r="4" fill="#38bdf8"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Total: Octal 0 to 7 Scale</text>
    </g>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <path d="M 320 285 L 340 285" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="340,281 346,285 340,289" fill="#3b82f6"/>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="347" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <rect x="347" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="347" y="186" width="266" height="1" fill="#475569"/>
    <text x="367" y="172" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Security Hardening</text>
    <g transform="translate(367, 212)">
      <circle cx="0" cy="0" r="4" fill="#818cf8"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Directories: 755 (drwxr-xr-x)</text>
      <circle cx="0" cy="46" r="4" fill="#818cf8"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Web Files: 644 (-rw-r--r--)</text>
      <circle cx="0" cy="92" r="4" fill="#818cf8"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">wp-config.php: 600 or 400</text>
      <circle cx="0" cy="138" r="4" fill="#818cf8"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Private SSH Keys: 600 Only</text>
    </g>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <path d="M 619 285 L 639 285" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="639,281 645,285 639,289" fill="#818cf8"/>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="646" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="646" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="646" y="186" width="266" height="1" fill="#334155"/>
    <text x="666" y="172" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Execution Threat Defense</text>
    <g transform="translate(666, 212)">
      <circle cx="0" cy="0" r="4" fill="#34d399"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Eliminate 777 Global Write</text>
      <circle cx="0" cy="46" r="4" fill="#34d399"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">CageFS Virtual Sandbox</text>
      <circle cx="0" cy="92" r="4" fill="#34d399"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Prevent Symlink Breaches</text>
      <circle cx="0" cy="138" r="4" fill="#34d399"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">PHP suEXEC Isolation</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <rect x="48" y="445" width="864" height="30" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="68" cy="460" r="5" fill="#38bdf8"/>
  <text x="82" y="464" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">LicenBase Interactive DevOps &amp; Sysadmin Architecture Suite</text>
  <text x="892" y="464" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">licenbase.com/tools</text>
</svg>
