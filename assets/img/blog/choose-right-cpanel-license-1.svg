<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">cPanel License Tier Comparison for VPS and Dedicated Servers</title>
  <desc id="d">Matrix comparing cPanel Solo, Admin, Pro, and Premier licenses based on account capacity and server environment.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  
  <!-- Tier 1: Solo & Admin -->
  <rect x="35" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="35" y="40" width="205" height="6" rx="3" fill="#3B82F6"/>
  <text x="50" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">cPanel Solo</text>
  <text x="50" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#2563EB">1 Account</text>
  <text x="50" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Target Server:</text>
  <text x="50" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Cloud VPS</text>
  <path d="M50 170 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="50" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Freelancers &amp; Devs</text>
  <text x="50" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Single high-traffic site</text>
  <text x="50" y="245" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Full WHM root access</text>
  <text x="50" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Staging environments</text>
  <rect x="50" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="137" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Entry VPS Tier</text>

  <!-- Tier 2: Admin -->
  <rect x="260" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="260" y="40" width="205" height="6" rx="3" fill="#2563EB"/>
  <text x="275" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">cPanel Admin</text>
  <text x="275" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Up to 5 Accounts</text>
  <text x="275" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Target Server:</text>
  <text x="275" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1E293B">VPS / Cloud Node</text>
  <path d="M275 170 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="275" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Small web agencies</text>
  <text x="275" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Multi-brand business</text>
  <text x="275" y="245" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Low memory footprint</text>
  <text x="275" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Cost-effective scaling</text>
  <rect x="275" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="362" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Agency VPS Tier</text>

  <!-- Tier 3: Pro -->
  <rect x="485" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="485" y="40" width="205" height="6" rx="3" fill="#1D4ED8"/>
  <text x="500" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">cPanel Pro</text>
  <text x="500" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Up to 30 Accounts</text>
  <text x="500" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Target Server:</text>
  <text x="500" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1E293B">High-Spec VPS</text>
  <path d="M500 170 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="500" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Reseller web hosts</text>
  <text x="500" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Growing client portfolio</text>
  <text x="500" y="245" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Supports CloudLinux</text>
  <text x="500" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Full automated backups</text>
  <rect x="500" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="587" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Mid-Size Reseller</text>

  <!-- Tier 4: Premier -->
  <rect x="710" y="40" width="215" height="340" rx="14" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <rect x="710" y="40" width="215" height="6" rx="3" fill="#10B981"/>
  <text x="725" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">cPanel Premier</text>
  <text x="725" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#059669">100+ Accounts (Scalable)</text>
  <text x="725" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Target Server:</text>
  <text x="725" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1E293B">Bare Metal Dedicated / VPS</text>
  <path d="M725 170 h185" stroke="#F1F5F9" stroke-width="1"/>
  <text x="725" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Web hosting providers</text>
  <text x="725" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Enterprise multi-tenant</text>
  <text x="725" y="245" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• LiteSpeed integration</text>
  <text x="725" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">• Unlimited scaling packs</text>
  <rect x="725" y="315" width="185" height="36" rx="8" fill="#ECFDF5"/>
  <text x="817" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Enterprise Dedicated</text>
</svg>
