  <text x="70" y="320" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Prevents Server Crashes</text>

  <rect x="295" y="95" width="210" height="280" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
