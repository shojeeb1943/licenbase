  <text x="315" y="170" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Virtualized Mounts</text>
  <text x="315" y="200" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Blocks Cross-User Sight</text>
  <text x="315" y="230" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Anti-Symlink Traversal</text>
