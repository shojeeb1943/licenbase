<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t6 d6">
  <title id="t6">CloudLinux OS Shared Pro Features and Limits Architecture</title>
  <desc id="d6">Feature breakdown of CloudLinux OS Shared Pro showing PHP X-Ray slow request tracing, centralized monitoring, and LVE.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">CloudLinux OS Shared Pro: Advanced Architecture &amp; Telemetry</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Feature Deep-Dive</text>

  <!-- Card 1: PHP X-Ray -->
  <g transform="translate(35, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#38BDF8"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">1. PHP X-Ray</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Automated APM Engine</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Primary Function</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Deep CMS call tracing</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Diagnoses</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Slow WordPress plugins, unindexed SQL, and external APIs</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">Sub-second bottlenecks</text>
    </g>
  </g>

  <!-- Card 2: Centralized Monitoring -->
  <g transform="translate(262, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#10B981"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#34D399">2. Centralized Metrics</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Multi-Server Telemetry</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Cluster Monitoring</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#34D399">Single Cloud Dashboard</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Proactive Alerts</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Identifies nodes nearing CPU, RAM, or IO saturation</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">Zero-agent latency</text>
    </g>
  </g>

  <!-- Card 3: Smart Advice -->
  <g transform="translate(489, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#F59E0B"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FBBF24">3. Smart Advice</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Automated Tuning</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">AI Optimization</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">WordPress Accelerators</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Automated Fixes</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Suggests object caching (Redis) &amp; image webp conversions</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#38BDF8">Cuts support tickets 50%</text>
    </g>
  </g>

  <!-- Card 4: Core LVE & CageFS -->
  <g transform="translate(715, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#A855F7"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#C084FC">4. Core LVE Stack</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Proven Foundation</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Kernel Isolation</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#C084FC">CageFS &amp; MySQL Gov</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Hard Quotas</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Zero noisy neighbors, 100% tenant resource sandboxing</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">The Gold Standard</text>
    </g>
  </g>
</svg>