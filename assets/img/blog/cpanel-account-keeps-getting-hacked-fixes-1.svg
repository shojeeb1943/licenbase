<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PERSISTENCE HUNTING &amp; ROOT CAUSE ANALYSIS</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Audit Checklist: When a cPanel Account Keeps Getting Hacked</text>

  <!-- Step 1: SSH & Access -->
  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. SSH &amp; Access Keys</text>
  <text x="60" y="175" fill="#38bdf8" font-family="monospace" font-size="10">cat ~/.ssh/authorized_keys</text>
  <text x="60" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Remove rogue public keys</text>
  <text x="60" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Disable cPanel SSH access</text>
  <text x="60" y="235" fill="#38bdf8" font-family="monospace" font-size="10">whmapi1 modifyacct shell=noshell</text>

  <!-- Step 2: Crons & Daemons -->
  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Hidden Crontabs</text>
  <text x="310" y="175" fill="#38bdf8" font-family="monospace" font-size="10">crontab -l -u username</text>
  <text x="310" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Inspect /var/spool/cron</text>
  <text x="310" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check curl/wget payload loops</text>
  <text x="310" y="235" fill="#38bdf8" font-family="monospace" font-size="10">crontab -r -u username</text>

  <!-- Step 3: PHP Webshells -->
  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Stealth PHP Backdoors</text>
  <text x="560" y="175" fill="#94a3b8" font-family="monospace" font-size="10">find . -name "*.ico.php"</text>
  <text x="560" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check wp-content/uploads/</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Audit auto_prepend_file in ini</text>
  <text x="560" y="235" fill="#38bdf8" font-family="monospace" font-size="10">grep -rn "auto_prepend_file" .</text>

  <!-- Step 4: Defense In Depth -->
  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Permanent Eradication &amp; Container Isolation:</text>
  <text x="60" y="340" fill="#22c55e" font-family="monospace" font-size="12">cagefsctl --reinit-user username &amp;&amp; imunify360-agent malware user scan username</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Rotate database passwords, regenerate security salts, enforce CageFS filesystem isolation, and monitor WAF blocks.</text>
</svg>
