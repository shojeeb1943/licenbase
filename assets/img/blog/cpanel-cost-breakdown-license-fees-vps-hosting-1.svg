<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t3 d3">
  <title id="t3">cPanel Server Monthly Cost Breakdown Analysis</title>
  <desc id="d3">Breakdown of software licenses, VPS compute, backups, and security costs for cPanel servers.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="60" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">cPanel Server Monthly Cost Breakdown (2026)</text>

  <!-- Left: Retail Direct Price -->
  <rect x="50" y="90" width="400" height="280" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="250" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">Standard Vendor Retail: ~$95/mo</text>
  
  <rect x="70" y="145" width="360" height="35" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="85" y="168" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">cPanel Admin (5 Accts) Direct:</text>
  <text x="415" y="168" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end">$29.99/mo</text>

  <rect x="70" y="188" width="360" height="35" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="85" y="211" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">LiteSpeed Web Host Direct:</text>
  <text x="415" y="211" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end">$26.00/mo</text>

  <rect x="70" y="231" width="360" height="35" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="85" y="254" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">Imunify360 Unlimited Direct:</text>
  <text x="415" y="254" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="end">$25.00/mo</text>

  <rect x="70" y="274" width="360" height="35" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="85" y="297" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">Cloud VPS Compute (4 vCPU / 8GB):</text>
  <text x="415" y="297" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="end">$14.00/mo</text>

  <rect x="70" y="320" width="360" height="35" rx="6" fill="#DC2626"/>
  <text x="250" y="343" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Annual Cost: $1,140 / year</text>

  <!-- Right: LicenBase Stack -->
  <rect x="490" y="90" width="420" height="280" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="700" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#16A34A" text-anchor="middle">With LicenBase Wholesale: ~$24.50/mo</text>

  <rect x="510" y="145" width="380" height="35" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="525" y="168" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">cPanel VPS License (LicenBase):</text>
  <text x="875" y="168" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#16A34A" text-anchor="end">$4.00/mo</text>

  <rect x="510" y="188" width="380" height="35" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="525" y="211" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">LiteSpeed Web Server (LicenBase):</text>
  <text x="875" y="211" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#16A34A" text-anchor="end">$5.00/mo</text>

  <rect x="510" y="231" width="380" height="35" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="525" y="254" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">Imunify360 Security (LicenBase):</text>
  <text x="875" y="254" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#16A34A" text-anchor="end">$1.50/mo</text>

  <rect x="510" y="274" width="380" height="35" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="525" y="297" font-family="Inter, sans-serif" font-size="13" fill="#1F2937">Cloud VPS Compute (Hetzner/OVH):</text>
  <text x="875" y="297" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="end">$14.00/mo</text>

  <rect x="510" y="320" width="380" height="35" rx="6" fill="#16A34A"/>
  <text x="700" y="343" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Annual Cost: $294 / year &bull; 74% Savings</text>
</svg>