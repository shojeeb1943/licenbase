  <text x="480" y="265" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Check NAT routing IP</text>
  <rect x="375" y="295" width="210" height="50" rx="10" fill="#F8FAFC"/>
  <text x="480" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="middle">System Time & DNS</text>

  <!-- Column 3 -->
  <rect x="660" y="50" width="260" height="320" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="660" y="50" width="260" height="6" rx="3" fill="#10B981"/>
  <circle cx="790" cy="110" r="30" fill="#F1F5F9"/>
