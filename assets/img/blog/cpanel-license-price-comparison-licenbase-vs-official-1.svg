<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">cPanel License Price Comparison: LicenBase vs Official</title>
  <desc id="d">Price comparison chart highlighting monthly savings across cPanel Solo, Admin, Pro, and Premier tiers.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="40" y="30" width="880" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="880" height="55" rx="16" fill="#F1F5F9"/>
  <text x="70" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0F172A">cPanel Tier</text>
  <text x="280" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Accounts Limit</text>
  <text x="480" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#EF4444">Official Retail Price</text>
  <text x="700" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#10B981">LicenBase Price</text>

  <!-- Row 1: Solo -->
  <line x1="40" y1="135" x2="920" y2="135" stroke="#E2E8F0"/>
  <text x="70" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0F172A">cPanel Solo</text>
  <text x="280" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#64748B">1 Account (VPS)</text>
  <text x="480" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">~$17.49 / mo</text>
  <rect x="690" y="92" width="160" height="32" rx="6" fill="#ECFDF5"/>
  <text x="770" y="113" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">Wholesale Discount</text>

  <!-- Row 2: Admin -->
  <line x1="40" y1="200" x2="920" y2="200" stroke="#E2E8F0"/>
  <text x="70" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0F172A">cPanel Admin</text>
  <text x="280" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#64748B">Up to 5 Accounts</text>
  <text x="480" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">~$29.99 / mo</text>
  <rect x="690" y="152" width="160" height="32" rx="6" fill="#ECFDF5"/>
  <text x="770" y="173" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">Wholesale Discount</text>

  <!-- Row 3: Pro -->
  <line x1="40" y1="265" x2="920" y2="265" stroke="#E2E8F0"/>
  <text x="70" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0F172A">cPanel Pro</text>
  <text x="280" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#64748B">Up to 30 Accounts</text>
  <text x="480" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">~$42.99 / mo</text>
  <rect x="690" y="212" width="160" height="32" rx="6" fill="#ECFDF5"/>
  <text x="770" y="233" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">Wholesale Discount</text>

  <!-- Row 4: Premier -->
  <line x1="40" y1="330" x2="920" y2="330" stroke="#E2E8F0"/>
  <text x="70" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0F172A">cPanel Premier</text>
  <text x="280" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#64748B">100+ Accounts (VPS/Dedicated)</text>
  <text x="480" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">~$60.99+ / mo</text>
  <rect x="690" y="277" width="160" height="32" rx="6" fill="#ECFDF5"/>
  <text x="770" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">Save Up to 70%</text>

  <!-- Bottom note -->
  <text x="480" y="365" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">All LicenBase licenses use official unmodified binaries with direct vendor repository updates.</text>
</svg>
