<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t8 d8">
  <title id="t8">cPanel License vs VPS Hosting Compute Comparison</title>
  <desc id="d8">Understanding the difference between server hardware infrastructure and web hosting software licensing.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="55" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Software License vs Infrastructure Compute: What Are You Paying For?</text>

  <!-- Left: Cloud VPS Infrastructure -->
  <rect x="40" y="85" width="415" height="285" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
  <rect x="40" y="85" width="415" height="8" rx="4" fill="#0284C7"/>
  <text x="247" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="middle">1. Cloud VPS (The Hardware)</text>
  
  <text x="65" y="160" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">What it provides:</text>
  <text x="75" y="185" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Physical CPU cores &amp; RAM memory</text>
  <text x="75" y="210" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; NVMe SSD storage space &amp; I/O operations</text>
  <text x="75" y="235" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Dedicated public IPv4 &amp; IPv6 addresses</text>
  <text x="75" y="260" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Data center uplink &amp; bandwidth pipes</text>

  <rect x="65" y="285" width="365" height="60" rx="6" fill="#E0F2FE"/>
  <text x="247" y="310" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">Providers: Hetzner, OVH, Vultr, DigitalOcean</text>
  <text x="247" y="330" font-family="Inter, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Typically costs $5 to $20/month</text>

  <!-- Right: cPanel License -->
  <rect x="505" y="85" width="415" height="285" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
  <rect x="505" y="85" width="415" height="8" rx="4" fill="#D97706"/>
  <text x="712" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">2. cPanel License (The Software)</text>
  
  <text x="530" y="160" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">What it provides:</text>
  <text x="540" y="185" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; WebHost Manager (WHM) &amp; cPanel control UI</text>
  <text x="540" y="210" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Automated DNS, Apache, MySQL, Exim daemons</text>
  <text x="540" y="235" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Free AutoSSL Let's Encrypt automated certs</text>
  <text x="540" y="260" font-family="Inter, sans-serif" font-size="12" fill="#334155">&bull; Client self-service email &amp; file managers</text>

  <rect x="530" y="285" width="365" height="60" rx="6" fill="#FEF3C7"/>
  <text x="712" y="310" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">LicenBase IP License: $4.00/month</text>
  <text x="712" y="330" font-family="Inter, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">Decouple hardware &amp; software for huge savings</text>
</svg>