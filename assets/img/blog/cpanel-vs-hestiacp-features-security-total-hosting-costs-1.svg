<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t10 d10">
  <title id="t10">cPanel vs HestiaCP Architecture and Feature Comparison</title>
  <desc id="d10">Feature matrix comparing cPanel commercial ecosystem and HestiaCP lightweight open-source stack.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="50" y="40" width="410" height="340" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="75" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">cPanel &amp; WHM</text>
  <text x="75" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Commercial Industry Standard</text>
  <path d="M75 120 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="150" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Industry standard client GUI &amp; universal migration tools</text>
  <text x="75" y="185" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Deep CloudLinux, LiteSpeed, Imunify360 &amp; JetBackup support</text>
  <text x="75" y="220" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Complete WHMCS automated billing integration</text>
  <text x="75" y="255" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Automated AutoSSL certificate issuance &amp; DCV validation</text>
  <text x="75" y="290" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• LicenBase wholesale licensing from $4/mo</text>
  <rect x="75" y="320" width="360" height="36" rx="8" fill="#EFF6FF"/>
  <text x="255" y="343" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Multi-Tenant Hosting / Resellers</text>

  <rect x="500" y="40" width="410" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="525" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">HestiaCP</text>
  <text x="525" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Open Source Lightweight Panel</text>
  <path d="M525 120 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="525" y="150" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Zero software license fee (GPL v3)</text>
  <text x="525" y="185" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Very low RAM footprint (runs well on 1GB VPS)</text>
  <text x="525" y="220" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Nginx caching reverse proxy in front of Apache</text>
  <text x="525" y="255" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Lacks enterprise LVE tenant isolation</text>
  <text x="525" y="290" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Manual troubleshooting &amp; smaller third-party ecosystem</text>
  <rect x="525" y="320" width="360" height="36" rx="8" fill="#F1F5F9"/>
  <text x="705" y="343" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Personal Projects / Dev Staging</text>
</svg>