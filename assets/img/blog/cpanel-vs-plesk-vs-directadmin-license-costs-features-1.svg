<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">cPanel vs Plesk vs DirectAdmin 2026</text>
  <text x="400" y="70" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Feature Matrix, Operating System Versatility &amp; Wholesale Pricing</text>
  <rect x="40" y="95" width="220" height="280" fill="#1e293b" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="150" y="130" fill="#f97316" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">cPanel &amp; WHM</text>
  <text x="60" y="170" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Linux Only (AlmaLinux/Ubuntu)</text>
  <text x="60" y="200" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Gold standard hosting ecosystem</text>
  <text x="60" y="230" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Best WHMCS synchronization</text>
  <text x="60" y="260" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Memory footprint: ~1.5 GB</text>
  <rect x="55" y="310" width="190" height="38" fill="#0f172a" stroke="#f97316" stroke-width="1" rx="6"/>
  <text x="150" y="334" fill="#f97316" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">LicenBase: $4.00/mo</text>

  <rect x="290" y="95" width="220" height="280" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="400" y="130" fill="#38bdf8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Plesk Obsidian</text>
  <text x="310" y="170" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Linux + Windows Server support</text>
  <text x="310" y="200" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Built-in Docker &amp; Git deployment</text>
  <text x="310" y="230" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• WordPress Toolkit flagship UI</text>
  <text x="310" y="260" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Memory footprint: ~1.2 GB</text>
  <rect x="305" y="310" width="190" height="38" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="6"/>
  <text x="400" y="334" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">LicenBase: $4.00/mo</text>

  <rect x="540" y="95" width="220" height="280" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="650" y="130" fill="#10b981" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">DirectAdmin</text>
  <text x="560" y="170" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Lowest RAM usage (~300 MB)</text>
  <text x="560" y="200" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• CustomBuild CLI power tools</text>
  <text x="560" y="230" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Smaller 3rd party plugin market</text>
  <text x="560" y="260" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">• Great for tiny 1 GB VPS servers</text>
  <rect x="555" y="310" width="190" height="38" fill="#0f172a" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="650" y="334" fill="#10b981" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Lightweight Alternative</text>
</svg>