<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">VPS CPU RESCUE &amp; CRYPTO-HIJACKING</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Detecting &amp; Removing Hidden XMRig Miners</text>

  <!-- Step 1: Detect Hidden Miner -->
  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Unmask Hidden Miner</text>
  <text x="60" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Inspect preload hooks:</text>
  <text x="60" y="195" fill="#38bdf8" font-family="monospace" font-size="10">cat /etc/ld.so.preload</text>
  <text x="60" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check active pool sockets:</text>
  <text x="60" y="235" fill="#38bdf8" font-family="monospace" font-size="10">ss -tupn | grep -E "3333|5555"</text>

  <!-- Step 2: Neutralize Safely -->
  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Freeze &amp; Disarm</text>
  <text x="310" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Freeze process (anti-respawn):</text>
  <text x="310" y="195" fill="#38bdf8" font-family="monospace" font-size="10">kill -STOP &lt;PID&gt;</text>
  <text x="310" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check parent &amp; executable:</text>
  <text x="310" y="235" fill="#94a3b8" font-family="monospace" font-size="10">ls -la /proc/&lt;PID&gt;/exe</text>

  <!-- Step 3: Destroy Persistence -->
  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Destroy Persistence</text>
  <text x="560" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Audit cron spool directories:</text>
  <text x="560" y="195" fill="#38bdf8" font-family="monospace" font-size="10">grep -rnw '/var/spool/cron'</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check systemd timers &amp; init</text>
  <text x="560" y="235" fill="#94a3b8" font-family="monospace" font-size="10">kill -9 &lt;PID&gt; &amp;&amp; rm -f /tmp/bin</text>

  <!-- Step 4: System Hardening -->
  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Filesystem Immunization &amp; Execution Lockdown:</text>
  <text x="60" y="340" fill="#22c55e" font-family="monospace" font-size="12">mount -o remount,noexec,nosuid,nodev /tmp &amp;&amp; mount -o remount,noexec,nosuid,nodev /dev/shm</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Mount shared memory and temporary directories with noexec, block outbound mining pool ports, and rotate root SSH keys.</text>
</svg>
