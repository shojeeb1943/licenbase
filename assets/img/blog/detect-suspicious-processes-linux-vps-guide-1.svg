<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Linux VPS Suspicious Process Detection Pipeline</title>
  <desc id="d">Step-by-step threat hunting pipeline to detect rogue crypto miners, spoofed binary names, unauthorized network sockets, and malicious crontab persistence on Linux servers.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="35" y="25" width="890" height="60" rx="12" fill="#0F172A"/>
  <text x="55" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Linux VPS Process Threat Hunting &amp; Malware Defense</text>
  <text x="735" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Zero Downtime Security</text>

  <!-- 4 Step Columns -->
  <!-- Col 1: High CPU / Miner Detection -->
  <g transform="translate(35, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#EFF6FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">01</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Miner &amp; CPU Spikes</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Check Process Trees:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• ps aux --sort=-%cpu</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Spot 100% CPU pinning</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check XMRig / kdevtmpfsi</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Inspect parent PID (PPID)</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#EFF6FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Isolate Miner PIDs</text>
  </g>

  <!-- Col 2: Binary Path & /proc -->
  <g transform="translate(263, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#ECFDF5"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">02</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Binary &amp; /proc/PID</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Verify Executable Path:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• ls -l /proc/&lt;PID&gt;/exe</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Flag binaries in /tmp or /dev</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Inspect deleted executable (exe)</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• View cat /proc/&lt;PID&gt;/cmdline</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#ECFDF5"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Unmask Spoofed Names</text>
  </g>

  <!-- Col 3: Unauthorized Sockets -->
  <g transform="translate(491, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#FEF3C7"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">03</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Network Sockets</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Check Outbound Connections:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• ss -tulpn &amp; lsof -i</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Spot unknown remote IPs</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Detect IRC / C2 beaconing</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Identify unauthorized ports</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#FEF3C7"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Block C2 Traffic</text>
  </g>

  <!-- Col 4: Persistence -->
  <g transform="translate(719, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#F3E8FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">04</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Persistence Cleanup</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Check Auto-Restart Hooks:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• crontab -l -u all_users</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check /etc/cron.* folders</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check /etc/systemd/system</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Inspect ~/.ssh/authorized_keys</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#F3E8FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">Purge Auto-Respawn</text>
  </g>
</svg>
