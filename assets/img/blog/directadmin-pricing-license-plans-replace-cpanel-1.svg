<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg4)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">DirectAdmin vs. cPanel: Licensing Economics &amp; Hardware Footprint</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Comparing monthly per-account licensing models, idle memory usage, and migration parity</text>

  <!-- Column 1: DirectAdmin -->
  <rect x="50" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="50" y="125" width="410" height="40" rx="12" fill="#059669"/>
  <text x="255" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">DirectAdmin (Personal / Lite / Standard)</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Flat-rate pricing (No harsh per-account penalty)</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Idle RAM: ~800 MB to 1 GB (Extremely lean)</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• CustomBuild engine (Apache/Nginx/OLS modularity)</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated cPanel cpmove restoration script</text>
  <text x="75" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Save up to 70% monthly on 100+ accounts</text>

  <!-- Column 2: cPanel & WHM -->
  <rect x="500" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="500" y="125" width="410" height="40" rx="12" fill="#2563eb"/>
  <text x="705" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cPanel &amp; WHM (Solo / Admin / Pro / Premier)</text>
  <text x="525" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Per-account surcharge above 100 users ($0.45+/acct)</text>
  <text x="525" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Idle RAM: 2 GB to 4 GB baseline requirement</text>
  <text x="525" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Industry standard brand awareness and plugins</text>
  <text x="525" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Easy-to-use enduser UI with zero customer training</text>
  <text x="525" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Wholesale LicenBase rates preserve margins</text>
</svg>
