<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg5)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Domain Reseller &amp; VPS Hosting Package Tier Modeling</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Bundling wholesale domain registrations with high-margin VPS hosting tiers to optimize customer LTV</text>

  <!-- Tier 1: Domain Hook -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#0284c7"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tier 1: Domain Hook</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Wholesale TLD (.com @ $9.50)</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Retail Sale: $13.99 / yr</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Gross Margin: $4.49 / yr</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Low-friction customer acquisition</text>
  <text x="75" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Acquisition Anchor</text>

  <!-- Arrow -->
  <path d="M 315 240 L 345 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Tier 2: Hosting Cross-Sell -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tier 2: Business VPS</text>
  <text x="375" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">cPanel + LiteSpeed Hosting</text>
  <text x="375" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Retail: $19.99 / mo ($239/yr)</text>
  <text x="375" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Infrastructure Cost: $4.50/mo</text>
  <text x="375" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Net Margin: 77.5%</text>
  <text x="375" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Core Profit Engine</text>

  <!-- Arrow -->
  <path d="M 615 240 L 645 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Tier 3: Annual Retention -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#d97706"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tier 3: Annual Bundle</text>
  <text x="675" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Domain + Managed Hosting</text>
  <text x="675" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Free domain included annually</text>
  <text x="675" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Customer retention up 85%</text>
  <text x="675" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• WHMCS automated renewals</text>
  <text x="675" y="325" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Maximum Lifetime Value</text>
</svg>
