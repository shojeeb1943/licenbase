  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bg7)"/>
  <text x="400" y="45" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" text-anchor="middle">cPanel License IP Migration &amp; Re-Activation Steps</text>
  <text x="400" y="72" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">How to Fix "Cannot Verify License" After Server IP Migration</text>

