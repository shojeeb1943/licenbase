  <text x="315" y="260" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Run mainipcheck</text>
  <text x="315" y="285" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Verify ifconfig output</text>
  <rect x="315" y="325" width="170" height="32" rx="6" fill="#0284c7" fill-opacity="0.2"/>
  <text x="400" y="346" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Local IP Re-Synced</text>

