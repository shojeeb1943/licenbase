  <text x="155" y="346" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Database Updated</text>

  <rect x="295" y="105" width="210" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="140" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Step 2: Server Cache</text>
  <text x="400" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Purge Old IP Records</text>
