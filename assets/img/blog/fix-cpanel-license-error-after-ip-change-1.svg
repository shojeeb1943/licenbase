  <text x="70" y="260" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Click "Reissue IP"</text>
  <text x="70" y="285" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• 100% Free instant change</text>
