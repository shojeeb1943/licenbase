<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">cPanel License Error Diagnostics and Resolution Flowchart</title>
  <desc id="d">Diagnostic troubleshooting tree for fixing license failed, IP mismatch, cpkeyclt timeout, and port 873 firewall blocks.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  
  <!-- Step 1: Warning Notice -->
  <rect x="40" y="40" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="40" width="260" height="4" rx="2" fill="#EF4444"/>
  <circle cx="70" cy="75" r="14" fill="#FEE2E2"/>
  <text x="70" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">!</text>
  <text x="95" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Error Detected</text>
  <text x="55" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">"Cannot verify license"</text>
  <text x="55" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">"License expired / invalid"</text>
  <text x="55" y="161" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#EF4444">WHM Login Blocked</text>

  <!-- Step 2: Check Public IP -->
  <rect x="350" y="40" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="350" y="40" width="260" height="4" rx="2" fill="#F59E0B"/>
  <circle cx="380" cy="75" r="14" fill="#FEF3C7"/>
  <text x="380" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">1</text>
  <text x="405" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Verify Outgoing IP</text>
  <text x="365" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">curl -s https://ifconfig.me</text>
  <text x="365" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Compare with LicenBase IP</text>
  <text x="365" y="161" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#D97706">Update IP if NAT / Mismatch</text>

  <!-- Step 3: Firewall Check -->
  <rect x="660" y="40" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="660" y="40" width="260" height="4" rx="2" fill="#F59E0B"/>
  <circle cx="690" cy="75" r="14" fill="#FEF3C7"/>
  <text x="690" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">2</text>
  <text x="715" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Check Port &amp; DNS</text>
  <text x="675" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Ensure TCP port 873 open</text>
  <text x="675" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">resolv.conf 8.8.8.8 / 1.1.1.1</text>
  <text x="675" y="161" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#D97706">csf -a IP / firewalld check</text>

  <!-- Step 4: Run Activation -->
  <rect x="40" y="230" width="420" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="230" width="420" height="4" rx="2" fill="#10B981"/>
  <circle cx="70" cy="265" r="14" fill="#ECFDF5"/>
  <text x="70" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">3</text>
  <text x="95" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Force License Key Sync</text>
  <rect x="65" y="295" width="370" height="34" rx="6" fill="#0F172A"/>
  <text x="80" y="317" font-family="Consolas, monospace" font-size="13" fill="#38BDF8">/usr/local/cpanel/cpkeyclt</text>
  <text x="65" y="355" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#10B981">Returns: "Updating... done."</text>

  <!-- Step 5: Success State -->
  <rect x="500" y="230" width="420" height="150" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="500" y="230" width="420" height="4" rx="2" fill="#10B981"/>
  <circle cx="530" cy="265" r="14" fill="#ECFDF5"/>
  <text x="530" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">✓</text>
  <text x="555" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">License Verified &amp; Active</text>
  <text x="525" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">WHM unlocked immediately with full access</text>
  <text x="525" y="328" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#64748B">Daily license sync cron restored</text>
  <text x="525" y="355" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#047857">Zero downtime for hosted websites</text>
</svg>
