<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t-upcp d-upcp">
  <title id="t-upcp">cPanel Update Failure and RPM Troubleshooting Flowchart</title>
  <desc id="d-upcp">Systematic 4-stage diagnostic runbook for resolving failed cPanel upcp maintenance updates and RPM package manager errors.</desc>
  <defs>
    <linearGradient id="bgUpcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="upcpShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="420" rx="16" fill="url(#bgUpcp)"/>

  <!-- Top Banner -->
  <rect x="30" y="22" width="900" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="52" cy="46" r="6" fill="#F59E0B"/>
  <text x="68" y="51" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">cPanel Update &amp; RPM Recovery Pipeline</text>
  <rect x="740" y="32" width="176" height="28" rx="6" fill="#D97706"/>
  <text x="828" y="50" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">WHM Diagnostics</text>

  <!-- Stage 1: Log Diagnosis -->
  <g transform="translate(35, 90)" filter="url(#upcpShadow)">
    <rect width="205" height="300" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="28" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#60A5FA" text-anchor="middle">1</text>
    <text x="50" y="35" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Inspect Logs</text>
    <path d="M14 54 h177" stroke="#1F2937" stroke-width="1"/>
    
    <text x="14" y="78" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.5">LOG IDENTIFICATION</text>
    <text x="14" y="102" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• /var/cpanel/updatelogs/</text>
    <text x="14" y="126" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Find latest timestamp log</text>
    <text x="14" y="150" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Classify failure phase:</text>
    <text x="20" y="174" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">- Core cPanel binary</text>
    <text x="20" y="196" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">- EA4 / PHP packages</text>
    <text x="20" y="218" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">- OS / YUM repository</text>

    <rect x="14" y="240" width="177" height="42" rx="8" fill="#1F2937" stroke="#3B82F6" stroke-width="1"/>
    <text x="102" y="258" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">PRIMARY COMMAND</text>
    <text x="102" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">tail -n 100 update.log</text>
  </g>

  <!-- Stage 2: Pre-flight Verification -->
  <g transform="translate(260, 90)" filter="url(#upcpShadow)">
    <rect width="205" height="300" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="28" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FBBF24" text-anchor="middle">2</text>
    <text x="50" y="35" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pre-Flight Checks</text>
    <path d="M14 54 h177" stroke="#1F2937" stroke-width="1"/>
    
    <text x="14" y="78" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.5">RESOURCE &amp; NETWORK</text>
    <text x="14" y="102" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Disk space: df -h (/var, /usr)</text>
    <text x="14" y="126" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Inode limits: df -i</text>
    <text x="14" y="150" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• DNS resolver connectivity</text>
    <text x="14" y="174" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Repository reachability</text>
    <text x="14" y="198" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Verify /etc/resolv.conf</text>

    <rect x="14" y="240" width="177" height="42" rx="8" fill="#1F2937" stroke="#F59E0B" stroke-width="1"/>
    <text x="102" y="258" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FDE68A" text-anchor="middle">PREVENT ABORTS</text>
    <text x="102" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Ensure 5GB+ Free Disk</text>
  </g>

  <!-- Stage 3: RPM & Package Fixes -->
  <g transform="translate(485, 90)" filter="url(#upcpShadow)">
    <rect width="205" height="300" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#EC4899" fill-opacity="0.2"/>
    <text x="28" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#F472B6" text-anchor="middle">3</text>
    <text x="50" y="35" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">RPM &amp; Repo Fix</text>
    <path d="M14 54 h177" stroke="#1F2937" stroke-width="1"/>
    
    <text x="14" y="78" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.5">SAFE REMEDIATION</text>
    <text x="14" y="102" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Clear stale /var/lib/rpm locks</text>
    <text x="14" y="126" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Rebuild RPM database</text>
    <text x="14" y="150" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Disable broken 3rd-party repos</text>
    <text x="14" y="174" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Run cPanel repair scripts</text>
    <text x="14" y="198" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Never force delete RPM DB</text>

    <rect x="14" y="240" width="177" height="42" rx="8" fill="#1F2937" stroke="#EC4899" stroke-width="1"/>
    <text x="102" y="258" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FBCFE8" text-anchor="middle">AUTOMATED TOOL</text>
    <text x="102" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F472B6" text-anchor="middle">find_and_fix_rpm_issues</text>
  </g>

  <!-- Stage 4: Sync & Health Verification -->
  <g transform="translate(710, 90)" filter="url(#upcpShadow)">
    <rect width="215" height="300" rx="12" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="35" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle">4</text>
    <text x="50" y="35" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Sync &amp; Verify</text>
    <path d="M14 54 h187" stroke="#1F2937" stroke-width="1"/>
    
    <text x="14" y="78" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.5">COMPLETION VALIDATION</text>
    <text x="14" y="102" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Re-run /scripts/upcp --sync</text>
    <text x="14" y="126" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Verify exit code 0 status</text>
    <text x="14" y="150" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Check cPanel version</text>
    <text x="14" y="174" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Validate cpdavd &amp; cpsrvd</text>
    <text x="14" y="198" font-family="Inter, sans-serif" font-size="11.5" fill="#E5E7EB">• Audit website services</text>

    <rect x="14" y="240" width="187" height="42" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="107" y="258" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">RESTORATION CONFIRMED</text>
    <text x="107" y="273" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">WHM 100% Operational</text>
  </g>
</svg>
