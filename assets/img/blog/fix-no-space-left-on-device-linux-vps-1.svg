<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Linux VPS No Space Left on Device Diagnostic Workflow</title>
  <desc id="d">Resolving block vs inode exhaustion, unlinked file descriptors, and temporary cache buildup.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  
    <!-- Box 1: 1. Block vs Inode -->
    <rect x="35" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="35" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="35" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="51" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">1. Block vs Inode</text>
    <rect x="51" y="105" width="175" height="26" rx="6" fill="#EFF6FF"/>
    <text x="61" y="122" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CAPACITY CHECK</text>
    <text x="51" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• df -h for raw blocks</text><text x="51" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• df -i for inode tables</text><text x="51" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Locate full partition</text><text x="51" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Identify root cause</text>
        
    <!-- Box 2: 2. Hidden Descriptors -->
    <rect x="262" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="262" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="262" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="278" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">2. Hidden Descriptors</text>
    <rect x="278" y="105" width="175" height="26" rx="6" fill="#F0FDF4"/>
    <text x="288" y="122" fill="#16A34A" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">UNLINKED DELETES</text>
    <text x="278" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• lsof +L1 open deleted</text><text x="278" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Restart logging daemons</text><text x="278" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Truncate locked logs</text><text x="278" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Free held storage</text>
        
    <!-- Box 3: 3. Inode Purge -->
    <rect x="489" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="489" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="489" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="505" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">3. Inode Purge</text>
    <rect x="505" y="105" width="175" height="26" rx="6" fill="#FAF5FF"/>
    <text x="515" y="122" fill="#9333EA" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SMALL FILE CLUSTERS</text>
    <text x="505" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• PHP session cleanup</text><text x="505" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Exim mail queue drop</text><text x="505" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Purge temp thumbnails</text><text x="505" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Clear /tmp & /var/tmp</text>
        
    <!-- Box 4: 4. System Cleanup -->
    <rect x="716" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="716" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="716" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="732" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">4. System Cleanup</text>
    <rect x="732" y="105" width="175" height="26" rx="6" fill="#FFF7ED"/>
    <text x="742" y="122" fill="#EA580C" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SYSTEM RECOVERY</text>
    <text x="732" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• journalctl --vacuum</text><text x="732" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• dnf / apt clean all</text><text x="732" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Docker volume prune</text><text x="732" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• JetBackup remote sync</text>
        
</svg>