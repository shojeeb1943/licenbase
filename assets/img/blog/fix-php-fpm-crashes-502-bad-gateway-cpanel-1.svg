<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t3 d3">
  <title id="t3">cPanel PHP-FPM Service Crashes and 502 Bad Gateway Architecture</title>
  <desc id="d3">Architecture diagram of Apache reverse proxy encountering 502 Bad Gateway due to exhausted PHP-FPM pool worker connections.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">cPanel PHP-FPM: Anatomy of a 502 Bad Gateway Crash</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Architecture &amp; Tuning</text>

  <!-- Left: What Causes the 502 Drop -->
  <g transform="translate(35, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#EF4444"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#EF4444">The Root Causes of 502 Bad Gateway</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Apache proxy fails to connect to backend Unix domain socket</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Worker Starvation: <tspan fill="#F87171" font-weight="600">pm.max_children reached (pool exhausted)</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Socket Disconnect: <tspan fill="#F87171" font-weight="600">Unclean crash leaves orphaned .sock file</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Memory Limit Kill: <tspan fill="#F87171" font-weight="600">PHP script exceeds memory_limit abruptly</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Execution Timeout: <tspan fill="#F87171" font-weight="600">request_terminate_timeout halts worker</tspan></text>
    </g>
  </g>

  <!-- Right: The Production Fix -->
  <g transform="translate(495, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#10B981"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#34D399">The Production Configuration Fix</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">WHM Multipool tuning and automated socket recovery</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Pool Scaling: <tspan fill="#34D399" font-weight="600">Calculate pm.max_children = (Total RAM / 60MB)</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Process Manager: <tspan fill="#34D399" font-weight="600">Switch from static to ondemand or dynamic</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Worker Recycling: <tspan fill="#34D399" font-weight="600">Set pm.max_requests = 500 to purge leaks</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Restart Command: <tspan fill="#34D399" font-weight="600">/scripts/restartsrv_apache_php_fpm</tspan></text>
    </g>
  </g>
</svg>