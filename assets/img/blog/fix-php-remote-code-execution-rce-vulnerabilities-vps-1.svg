<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg2)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">PHP Remote Code Execution (RCE) Defense &amp; Hardening Stack</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Multi-layered defense: disable_functions, open_basedir, CageFS virtualization, and Imunify360 WAF</text>

  <!-- Layer 1: Ingress / WAF -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#b91c1c"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1. Web Application Firewall</text>
  <text x="75" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• Imunify360 / ModSecurity</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Blocks unserialize() payloads</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Inspects POST &amp; multipart args</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Stops zero-day CMS exploits</text>
  <text x="75" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Exploit Payloads Dropped</text>

  <!-- Layer 2: PHP Engine -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#d97706"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2. PHP Engine Lockdown</text>
  <text x="375" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• disable_functions Directive</text>
  <text x="375" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Disable exec, shell_exec, system</text>
  <text x="375" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• allow_url_include = Off</text>
  <text x="375" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• enforce open_basedir paths</text>
  <text x="375" y="325" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Shell Invocations Neutered</text>

  <!-- Layer 3: Kernel Sandbox -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3. CageFS Virtualization</text>
  <text x="675" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• CloudLinux OS Isolation</text>
  <text x="675" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Traps tenant in virtual filesystem</text>
  <text x="675" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Hides /etc/passwd &amp; neighbor DBs</text>
  <text x="675" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Restricts /bin/sh &amp; compilers</text>
  <text x="675" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">100% Server Integrity</text>
</svg>
