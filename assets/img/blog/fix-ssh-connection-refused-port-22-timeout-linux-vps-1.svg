<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg3)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">SSH Connection Refused vs. Timeout Diagnostic Tree</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Distinguishing daemon crashes from firewall drops and recovering via VNC console</text>

  <!-- Left: Connection Refused -->
  <rect x="50" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="50" y="125" width="410" height="40" rx="12" fill="#d97706"/>
  <text x="255" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Symptom 1: "Connection Refused" (RST packet returned)</text>
  <text x="75" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• sshd daemon is stopped or crashed</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Port changed in /etc/ssh/sshd_config (e.g. to 2222)</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Syntax error prevented sshd reload</text>
  <text x="75" y="285" fill="#f8fafc" font-family="monospace" font-size="12">VNC Fix: systemctl status sshd &amp;&amp; sshd -t</text>
  <text x="75" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fix: Correct config &amp; systemctl restart sshd</text>

  <!-- Right: Connection Timed Out -->
  <rect x="500" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="500" y="125" width="410" height="40" rx="12" fill="#b91c1c"/>
  <text x="705" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Symptom 2: "Connection Timed Out" (Silent packet drop)</text>
  <text x="525" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• IPTables / CSF firewall dropped packet</text>
  <text x="525" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Fail2ban banned client public IP</text>
  <text x="525" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Cloud security group (AWS/Hetzner) blocking Port 22</text>
  <text x="525" y="285" fill="#f8fafc" font-family="monospace" font-size="12">VNC Fix: csf -a YOUR_IP &amp;&amp; csf -r</text>
  <text x="525" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fix: Whitelist IP &amp; open firewall ingress</text>
</svg>
