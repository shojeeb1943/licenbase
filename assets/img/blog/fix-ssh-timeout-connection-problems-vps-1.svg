<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">SSH Connection Dropouts and Timeout Resolution Workflow</title>
  <desc id="d">Resolving client-server keepalives, firewall state timeouts, MTU black holes, and console failover.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  
    <!-- Box 1: 1. Problem Triage -->
    <rect x="35" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="35" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="35" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="51" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">1. Problem Triage</text>
    <rect x="51" y="105" width="175" height="26" rx="6" fill="#EFF6FF"/>
    <text x="61" y="122" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIMEOUT SYMPTOMS</text>
    <text x="51" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Write failed: Broken pipe</text><text x="51" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Idle session freezes</text><text x="51" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Connection closed by peer</text><text x="51" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Inspect ssh -vvv logs</text>
        
    <!-- Box 2: 2. Server KeepAlive -->
    <rect x="262" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="262" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="262" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="278" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">2. Server KeepAlive</text>
    <rect x="278" y="105" width="175" height="26" rx="6" fill="#F0FDF4"/>
    <text x="288" y="122" fill="#16A34A" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SSHD_CONFIG</text>
    <text x="278" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• ClientAliveInterval 60</text><text x="278" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• ClientAliveCountMax 3</text><text x="278" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• TCPKeepAlive yes</text><text x="278" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Reload sshd service</text>
        
    <!-- Box 3: 3. Client & Network -->
    <rect x="489" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="489" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="489" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="505" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">3. Client & Network</text>
    <rect x="505" y="105" width="175" height="26" rx="6" fill="#FAF5FF"/>
    <text x="515" y="122" fill="#9333EA" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CLIENT & MTU</text>
    <text x="505" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• ServerAliveInterval 60</text><text x="505" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Check NAT state timeouts</text><text x="505" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Set MTU 1420 / 1500</text><text x="505" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Fix VPN PMTUD black hole</text>
        
    <!-- Box 4: 4. Failover Recovery -->
    <rect x="716" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="716" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="716" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="732" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">4. Failover Recovery</text>
    <rect x="732" y="105" width="175" height="26" rx="6" fill="#FFF7ED"/>
    <text x="742" y="122" fill="#EA580C" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EMERGENCY ACCESS</text>
    <text x="732" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Virtualizor VNC console</text><text x="732" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Cloud web serial terminal</text><text x="732" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Rescue mode reboot</text><text x="732" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Reset SSH configuration</text>
        
</svg>