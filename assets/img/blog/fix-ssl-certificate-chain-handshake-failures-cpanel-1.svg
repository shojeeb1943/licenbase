<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg3)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">SSL Certificate Chain of Trust &amp; SNI Handshake Flow</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Diagnosing incomplete intermediate CA bundles, expired root trust stores, and cPanel SNI misconfigurations</text>

  <!-- Step 1: Client Hello -->
  <rect x="50" y="125" width="200" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="200" height="40" rx="12" fill="#0284c7"/>
  <text x="150" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1. Client TLS Hello</text>
  <text x="70" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Browser / cURL hit</text>
  <text x="70" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Transmits SNI Host</text>
  <text x="70" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Cipher Suite List</text>
  <text x="70" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• TLS 1.3 / 1.2 request</text>
  <text x="70" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Handshake Initialized</text>

  <!-- Flow 1 -->
  <path d="M 255 240 L 285 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 2: Server Certificate -->
  <rect x="290" y="125" width="200" height="230" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="290" y="125" width="200" height="40" rx="12" fill="#2563eb"/>
  <text x="390" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2. Server Leaf Cert</text>
  <text x="310" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Issued for Domain</text>
  <text x="310" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• RSA 2048 / ECDSA</text>
  <text x="310" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Public Key match</text>
  <text x="310" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check SAN aliases</text>
  <text x="310" y="325" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Signed by Intermediate</text>

  <!-- Flow 2 -->
  <path d="M 495 240 L 525 240" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 3: Intermediate CA Bundle -->
  <rect x="530" y="125" width="200" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="530" y="125" width="200" height="40" rx="12" fill="#d97706"/>
  <text x="630" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3. CA Intermediate</text>
  <text x="550" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• SSLCertificateChainFile</text>
  <text x="550" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Missing bundle = ERROR</text>
  <text x="550" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Let's Encrypt R10/R11</text>
  <text x="550" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• cPanel AutoSSL hook</text>
  <text x="550" y="325" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Trust Link to Root</text>

  <!-- Flow 3 -->
  <path d="M 735 240 L 765 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 4: Root Trust Store -->
  <rect x="770" y="125" width="140" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="770" y="125" width="140" height="40" rx="12" fill="#059669"/>
  <text x="840" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">4. Root Anchor</text>
  <text x="785" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">• OS Trust Store</text>
  <text x="785" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• ISRG Root X1</text>
  <text x="785" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Browser Verified</text>
  <text x="785" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Padlock Green</text>
  <text x="785" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Handshake 200 OK</text>
</svg>
