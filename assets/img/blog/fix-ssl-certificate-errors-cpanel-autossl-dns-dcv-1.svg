<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t14 d14">
  <title id="t14">cPanel AutoSSL Domain Control Validation (DCV) Architecture</title>
  <desc id="d14">Troubleshooting flow for HTTP-01 DCV pre-flight checks, CAA records, and proxy SSL validation.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="40" y="40" width="260" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="60" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. HTTP-01 DCV Check</text>
  <text x="60" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">.well-known/pki-validation</text>
  <path d="M60 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• AutoSSL drops token file</text>
  <text x="60" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Public HTTP request test</text>
  <text x="60" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• .htaccess redirect rewrite loops</text>
  <text x="60" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Ensure file is publicly readable</text>
  <rect x="60" y="310" width="220" height="36" rx="8" fill="#EFF6FF"/>
  <text x="170" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">HTTP Path Accessible</text>

  <rect x="350" y="40" width="260" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="370" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. DNS &amp; CAA Records</text>
  <text x="370" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Certificate Authority Auth</text>
  <path d="M370 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="370" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• 'A' record points to cPanel IP</text>
  <text x="370" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• CAA restricts CA issuance</text>
  <text x="370" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Allow letsencrypt.org / sectigo</text>
  <text x="370" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Cloudflare proxy mode conflicts</text>
  <rect x="370" y="310" width="220" height="36" rx="8" fill="#EFF6FF"/>
  <text x="480" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">DNS Authorization</text>

  <rect x="660" y="40" width="260" height="340" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="680" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. Force WHM AutoSSL</text>
  <text x="680" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#059669">Queue Renewal</text>
  <path d="M680 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="680" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• WHM &gt; Manage AutoSSL</text>
  <text x="680" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Run AutoSSL for user account</text>
  <text x="680" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Inspect DCV log in real time</text>
  <text x="680" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Immediate certificate installation</text>
  <rect x="680" y="310" width="220" height="36" rx="8" fill="#ECFDF5"/>
  <text x="790" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Active Padlock Verified</text>
</svg>