<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg7)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Virtualizor KVM Provisioning &amp; IP Pool Conflict Resolution</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Resolving storage pool lockups, bridge interface drops (viifbr0), and duplicate IP allocations</text>

  <!-- Box 1: Storage & LVM Lockups -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#d97706"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Storage &amp; Image Locks</text>
  <text x="75" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• "Cannot allocate disk space"</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• LVM thin-pool 100% capacity</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Corrupted OS template qcow2</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Missing NFS/ZFS mount point</text>
  <text x="75" y="325" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fix: lvextend &amp; template sync</text>

  <!-- Box 2: IP Subnet & MAC Conflicts -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#b91c1c"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">IP Pool &amp; Gateway Errors</text>
  <text x="375" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• Duplicate IP assigned in pool</text>
  <text x="375" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Wrong CIDR netmask / gateway</text>
  <text x="375" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Hetzner / OVH virtual MAC drop</text>
  <text x="375" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• ARP cache spoofing warning</text>
  <text x="375" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fix: Assign Virtual MAC in pool</text>

  <!-- Box 3: Network Bridge Recovery -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Bridge &amp; Service Fixes</text>
  <text x="675" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Rebuild viifbr0 bridge</text>
  <text x="675" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• systemctl restart virtnetwork</text>
  <text x="675" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Refresh libvirtd KVM service</text>
  <text x="675" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Re-sync WHMCS module credentials</text>
  <text x="675" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Flawless 1-Click Provisioning</text>
</svg>
