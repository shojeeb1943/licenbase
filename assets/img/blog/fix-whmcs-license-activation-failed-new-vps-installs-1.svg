<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg2)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Troubleshooting "WHMCS License Activation Failed" on VPS</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Step-by-step diagnostic chain: Port 443 outbound, cURL DNS resolution, and IP key re-issuance</text>

  <!-- Box 1: Error Stage -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#b91c1c"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Symptom &amp; Root Cause</text>
  <text x="70" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• "License Activation Failed"</text>
  <text x="70" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Outbound Port 443 blocked</text>
  <text x="70" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• VPS Public IP mismatch</text>
  <text x="70" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Expired cURL SSL CA bundle</text>
  <text x="70" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Admin Area Locked Out</text>

  <!-- Box 2: Diagnostic Commands -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#0284c7"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CLI Diagnostics</text>
  <text x="370" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-family="monospace">curl -Iv https://licensing.whmcs.com</text>
  <text x="370" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Test CSF firewall: TCP_OUT 443</text>
  <text x="370" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check IP: curl -4 ifconfig.co</text>
  <text x="370" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Verify PHP curl &amp; openssl ext</text>
  <text x="370" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Isolate Handshake Drop</text>

  <!-- Box 3: Resolution -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Resolution Steps</text>
  <text x="670" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Re-issue IP in Client Portal</text>
  <text x="670" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Update configuration.php key</text>
  <text x="670" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Whitelist 443 in CSF &amp; reload</text>
  <text x="670" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Truncate tblconfiguration cache</text>
  <text x="670" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">License Validated &amp; Active</text>
</svg>
