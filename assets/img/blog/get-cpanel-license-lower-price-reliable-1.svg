<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Lower Cost cPanel Licensing: Reliable IP Auth vs Dangerous Nulled Scripts</title>
  <desc id="d">Comparison of authentic automated IP licensing against malicious nulled scripts: security, updates, stability, and production reliability.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Left: Authentic Low Cost IP Licensing -->
  <rect x="50" y="40" width="410" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="50" y="40" width="410" height="8" rx="4" fill="#10B981"/>
  <text x="80" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0F172A">LicenBase IP Licensing</text>
  
  <circle cx="85" cy="140" r="12" fill="#ECFDF5"/>
  <path d="M80 140l3 3 7-7" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="110" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Direct Official cPanel Upstream Repos</text>

  <circle cx="85" cy="195" r="12" fill="#ECFDF5"/>
  <path d="M80 195l3 3 7-7" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="110" y="201" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Zero Modified PHP or Core Binaries</text>

  <circle cx="85" cy="250" r="12" fill="#ECFDF5"/>
  <path d="M80 250l3 3 7-7" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="110" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Automatic Security &amp; Kernel Patches</text>

  <circle cx="85" cy="305" r="12" fill="#ECFDF5"/>
  <path d="M80 305l3 3 7-7" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="110" y="311" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1E293B">100% Production Reliability &amp; Uptime</text>

  <!-- Right: Risky Nulled Scripts -->
  <rect x="500" y="40" width="410" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="500" y="40" width="410" height="8" rx="4" fill="#EF4444"/>
  <text x="530" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Cracked / Nulled Scripts</text>

  <circle cx="535" cy="140" r="12" fill="#FEF2F2"/>
  <path d="M530 135l10 10M540 135l-10 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">Updates Break &amp; Brick WHM Panels</text>

  <circle cx="535" cy="195" r="12" fill="#FEF2F2"/>
  <path d="M530 190l10 10M540 190l-10 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="201" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">Hidden Backdoors &amp; Crypto Miners</text>

  <circle cx="535" cy="250" r="12" fill="#FEF2F2"/>
  <path d="M530 245l10 10M540 245l-10 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">Tampered Source Code &amp; Binaries</text>

  <circle cx="535" cy="305" r="12" fill="#FEF2F2"/>
  <path d="M530 300l10 10M540 300l-10 10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="311" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#64748B">Extreme Blacklist &amp; Data Breach Risk</text>
</svg>
