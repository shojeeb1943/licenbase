<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">VPS Server Cost Breakdown in 2026</title>
  <desc id="d">Total cost of ownership breakdown for a VPS server including cloud compute hardware, software licensing, and server management.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">VPS Server Pricing: 2026 Total Cost of Ownership</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">TCO Breakdown</text>

  <!-- 4 Cost Pillars -->
  <g transform="translate(35, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#38BDF8"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">1. Cloud Compute</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">$4.50 - $25<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• 1 to 8 vCPU cores</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• 2GB to 16GB RAM</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Pure NVMe RAID-10</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Dedicated IPv4</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• 1Gbps uplink port</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Base Hardware</text>
  </g>

  <g transform="translate(263, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#10B981"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">2. Control Panel</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#10B981">$4.00 - $40<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• LicenBase cPanel: $4</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Retail cPanel: $22 - $40</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Plesk Web Host: $4.50</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Webuzo: $4.00/mo</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Full WHM automation</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">Software License</text>
  </g>

  <g transform="translate(491, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#F59E0B"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">3. Management</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#F59E0B">$0 - $40<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Unmanaged: $0 (DIY)</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• LicenBase Managed: $18</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Legacy Hosts: $40 - $70</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• CSF firewall &amp; updates</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• 24/7 crash recovery</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">Administration</text>
  </g>

  <g transform="translate(719, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#A855F7"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">4. Speed &amp; Security</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#A855F7">$4.00 - $10<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• LiteSpeed: $4/mo</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• CloudLinux OS: $4/mo</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Imunify360: $6/mo</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• JetBackup: $1.50/mo</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Softaculous: $1.00/mo</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#A855F7" text-anchor="middle">Turbo Addons</text>
  </g>
</svg>