<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t7 d7">
  <title id="t7">cPanel Webmail Port Architecture and Routing Paths</title>
  <desc id="d7">Overview of Webmail ports 2096 SSL, 2095 non-SSL, proxy subdomains, and webmail clients.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="50" y="40" width="410" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="75" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Standard Webmail URL Schemes</text>
  <text x="75" y="98" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Direct port &amp; proxy methods</text>
  <path d="M75 120 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="150" font-family="Inter, sans-serif" font-size="13" fill="#1E293B"><strong>Direct Port (SSL):</strong> https://yourdomain.com:2096</text>
  <text x="75" y="185" font-family="Inter, sans-serif" font-size="13" fill="#1E293B"><strong>Direct Port (Plain):</strong> http://yourdomain.com:2095</text>
  <text x="75" y="220" font-family="Inter, sans-serif" font-size="13" fill="#1E293B"><strong>Subdomain Proxy:</strong> https://webmail.yourdomain.com</text>
  <text x="75" y="255" font-family="Inter, sans-serif" font-size="13" fill="#1E293B"><strong>Alias Directory:</strong> https://yourdomain.com/webmail</text>
  <text x="75" y="290" font-family="Inter, sans-serif" font-size="13" fill="#1E293B"><strong>Server Hostname:</strong> https://server.hostname.com:2096</text>
  <rect x="75" y="320" width="360" height="36" rx="8" fill="#EFF6FF"/>
  <text x="255" y="343" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">Port 2096 Encrypted with TLS 1.3</text>

  <rect x="500" y="40" width="410" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="525" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Webmail Features &amp; Troubleshooting</text>
  <text x="525" y="98" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Client tools and quick error resolution</text>
  <path d="M525 120 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="525" y="150" font-family="Inter, sans-serif" font-size="13" fill="#334155">• Roundcube client interface: Responsive &amp; mobile friendly</text>
  <text x="525" y="185" font-family="Inter, sans-serif" font-size="13" fill="#334155">• Email filters, forwarders &amp; autoresponders configuration</text>
  <text x="525" y="220" font-family="Inter, sans-serif" font-size="13" fill="#334155">• BoxTrapper spam verification &amp; PGP key management</text>
  <text x="525" y="255" font-family="Inter, sans-serif" font-size="13" fill="#334155">• If port blocked by WiFi: use webmail.yourdomain.com proxy</text>
  <text x="525" y="290" font-family="Inter, sans-serif" font-size="13" fill="#334155">• Login format: Always full email address (user@domain.com)</text>
  <rect x="525" y="320" width="360" height="36" rx="8" fill="#ECFDF5"/>
  <text x="705" y="343" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">Seamless Cross-Device Access</text>
</svg>