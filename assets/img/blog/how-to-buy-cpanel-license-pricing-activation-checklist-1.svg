<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t3 d3">
  <title id="t3">How to Buy a cPanel License: Official Store vs LicenBase Partner</title>
  <desc id="d3">Comparison and checklist for buying a cPanel VPS license, IP binding, and verify command.</desc>
  <rect width="960" height="420" rx="16" fill="#111827"/>

  <!-- Left: Official WebPros Direct -->
  <g transform="translate(50, 45)">
    <rect width="410" height="330" rx="12" fill="#1F2937" stroke="#4B5563" stroke-width="2"/>
    <text x="30" y="40" fill="#EF4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OFFICIAL STORE (DIRECT)</text>
    <text x="30" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Expensive &amp; Rigid</text>
    <text x="30" y="115" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="13">• Solo (1 Account): $17.49 / mo</text>
    <text x="30" y="145" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="13">• Admin (5 Accounts): $31.49 / mo</text>
    <text x="30" y="175" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="13">• Pro (30 Accounts): $46.49 / mo</text>
    <text x="30" y="205" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="13">• Premier (100 Accounts): $65.99 / mo</text>
    <text x="30" y="235" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">• Strict annual price hikes</text>
    <text x="30" y="260" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">• Per-account overage penalties</text>
    <rect x="30" y="280" width="350" height="40" rx="8" fill="#374151"/>
    <text x="205" y="305" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Annual Cost for 1 VPS: $375 - $790+</text>
  </g>

  <!-- Right: LicenBase Automated Partner -->
  <g transform="translate(500, 45)">
    <rect width="410" height="330" rx="12" fill="#1F2937" stroke="#3B82F6" stroke-width="2"/>
    <text x="30" y="40" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="700">LICENBASE DISTRIBUTOR</text>
    <text x="30" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Affordable &amp; Unlimited</text>
    <text x="30" y="115" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13">• Flat VPS License: <tspan fill="#34D399" font-weight="700">From $4.00 / mo</tspan></text>
    <text x="30" y="145" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13">• Dedicated Server: <tspan fill="#34D399" font-weight="700">From $8.00 / mo</tspan></text>
    <text x="30" y="175" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13">• Unlimited cPanel Accounts Included</text>
    <text x="30" y="205" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13">• Instant IP Binding with 1-Command Sync</text>
    <text x="30" y="235" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12">• Automated zero-downtime key renewal</text>
    <text x="30" y="260" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12">• Compatible with AlmaLinux, Rocky &amp; Ubuntu</text>
    <rect x="30" y="280" width="350" height="40" rx="8" fill="#1E3A8A"/>
    <text x="205" y="305" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Annual Cost for 1 VPS: Just $48.00</text>
