<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t9 d9">
  <title id="t9">cPanel Release Tiers and Update Troubleshooting Workflow</title>
  <desc id="d9">cPanel update tiers (Edge, Current, Release, LTS) and inspection steps for update failure recovery.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="40" y="35" width="200" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="55" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">LTS (Long Term)</text>
  <text x="55" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Ultra-Conservative</text>
  <path d="M55 115 h170" stroke="#F1F5F9" stroke-width="1"/>
  <text x="55" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Supported for 1+ year</text>
  <text x="55" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Security patches only</text>
  <text x="55" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Zero breaking changes</text>
  <text x="55" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Enterprise stability</text>
  <rect x="55" y="310" width="170" height="38" rx="8" fill="#F1F5F9"/>
  <text x="140" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">LTS Stability</text>

  <rect x="270" y="35" width="200" height="350" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="285" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">RELEASE (Default)</text>
  <text x="285" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Recommended Production</text>
  <path d="M285 115 h170" stroke="#F1F5F9" stroke-width="1"/>
  <text x="285" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Fully QA tested builds</text>
  <text x="285" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Stable new features</text>
  <text x="285" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• High community uptake</text>
  <text x="285" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Daily automated crons</text>
  <rect x="285" y="310" width="170" height="38" rx="8" fill="#EFF6FF"/>
  <text x="370" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Production Pick</text>

  <rect x="500" y="35" width="200" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="515" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">CURRENT</text>
  <text x="515" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">Early Adopters</text>
  <path d="M515 115 h170" stroke="#F1F5F9" stroke-width="1"/>
  <text x="515" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• New feature releases</text>
  <text x="515" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Staging environments</text>
  <text x="515" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Minor edge case bugs</text>
  <text x="515" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Regular changelog diffs</text>
  <rect x="515" y="310" width="170" height="38" rx="8" fill="#FEF3C7"/>
  <text x="600" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Staging Servers</text>

  <rect x="730" y="35" width="190" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="745" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Recovery Actions</text>
  <text x="745" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">Post-Update Fixes</text>
  <path d="M745 115 h160" stroke="#F1F5F9" stroke-width="1"/>
  <text x="745" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Check: /var/cpanel/updatelogs</text>
  <text x="745" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Force: /scripts/upcp --force</text>
  <text x="745" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Fix EA4: ea_install_profile</text>
  <text x="745" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Rebuild Apache configs</text>
  <rect x="745" y="310" width="160" height="38" rx="8" fill="#ECFDF5"/>
  <text x="825" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Log Analysis</text>
</svg>