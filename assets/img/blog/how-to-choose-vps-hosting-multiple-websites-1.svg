<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Multi-Website VPS Architecture and Sizing</title>
  <desc id="d">Architecture diagram illustrating control panel user isolation, memory allocation, and software acceleration for hosting multiple websites on a single VPS.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Multi-Website VPS: Architecture &amp; Density Planning</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Agency Sizing</text>

  <!-- 3 Stages -->
  <g transform="translate(35, 104)">
    <rect width="280" height="280" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <rect width="280" height="6" rx="3" fill="#38BDF8"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">5 - 10 Websites (Small Agency)</text>
    <text x="20" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Portfolio sites and client blogs</text>
    <path d="M20 76 h240" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• vCPU: 2 Cores</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• RAM: 4GB Dedicated Memory</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Storage: 50GB NVMe RAID-10</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Control Panel: cPanel Admin (5 accts)</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Cache: LiteSpeed Site Owner</text>
    <rect x="20" y="226" width="240" height="34" rx="8" fill="#0F172A"/>
    <text x="140" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Total Cost: ~$18 - $24 / mo</text>
  </g>

  <g transform="translate(340, 104)">
    <rect width="280" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="280" height="6" rx="3" fill="#10B981"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10B981">15 - 30 Websites (Studio Host)</text>
    <text x="20" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Active business sites &amp; e-commerce</text>
    <path d="M20 76 h240" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• vCPU: 4 Cores</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• RAM: 8GB Dedicated Memory</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Storage: 100GB NVMe RAID-10</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Control Panel: cPanel Pro (30 accts)</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Isolation: CloudLinux OS CageFS</text>
    <rect x="20" y="226" width="240" height="34" rx="8" fill="#0F172A"/>
    <text x="140" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">Total Cost: ~$28 - $36 / mo</text>
  </g>

  <g transform="translate(645, 104)">
    <rect width="280" height="280" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect width="280" height="6" rx="3" fill="#F59E0B"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F59E0B">50+ Websites (Reseller Cluster)</text>
    <text x="20" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Commercial hosting provider node</text>
    <path d="M20 76 h240" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• vCPU: 6 - 8 Cores</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• RAM: 16GB Dedicated Memory</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Storage: 200GB+ Enterprise NVMe</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Control Panel: cPanel Premier / Webuzo</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Security: Imunify360 Unlimited</text>
    <rect x="20" y="226" width="240" height="34" rx="8" fill="#0F172A"/>
    <text x="140" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">Total Cost: ~$45 - $65 / mo</text>
  </g>
</svg>