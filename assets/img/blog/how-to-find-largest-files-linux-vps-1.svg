<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LINUX VPS STORAGE AUDIT TOOLKIT</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Quick Commands to Find &amp; Clean Bloated Files</text>

  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Top 10 Files &gt; 100MB</text>
  <text x="60" y="175" fill="#94a3b8" font-family="monospace" font-size="10">find / -type f -size +100M</text>
  <text x="60" y="195" fill="#94a3b8" font-family="monospace" font-size="10">-exec ls -lh {} + 2&gt;/dev/null</text>
  <text x="60" y="215" fill="#94a3b8" font-family="monospace" font-size="10">| awk '{ print $5, $9 }'</text>
  <text x="60" y="235" fill="#94a3b8" font-family="monospace" font-size="10">| sort -hr | head -10</text>

  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Largest Directories</text>
  <text x="310" y="175" fill="#94a3b8" font-family="monospace" font-size="11">du -ahx / 2&gt;/dev/null</text>
  <text x="310" y="195" fill="#94a3b8" font-family="monospace" font-size="11">| sort -rh | head -15</text>
  <text x="310" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Interactive alternative:</text>
  <text x="310" y="235" fill="#38bdf8" font-family="monospace" font-size="11">ncdu /</text>

  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Common Culprits</text>
  <text x="560" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/log/*.log (Unrotated)</text>
  <text x="560" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/lib/mysql/ibdata1</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /home/*/cpmove-*.tar.gz</text>
  <text x="560" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /tmp/lshttpd/cache</text>

  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Zero-Out Log Without Crashing Services:</text>
  <text x="60" y="340" fill="#22c55e" font-family="monospace" font-size="12">&gt; /var/log/nginx/error.log  # (or truncate -s 0 file.log)</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Reclaims disk space instantly while active daemons keep their existing open file descriptors.</text>
</svg>