<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">cPanel AutoSSL Domain Control Validation (DCV) Troubleshooting</title>
  <desc id="d">Diagnostic flow for troubleshooting failed cPanel AutoSSL certificates, Let's Encrypt DCV errors, CAA records, and redirect loops.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="35" y="25" width="890" height="60" rx="12" fill="#0F172A"/>
  <text x="55" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">cPanel AutoSSL &amp; DCV Resolution Workflow</text>
  <text x="735" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Instant SSL Issuance</text>

  <!-- 4 Step Columns -->
  <!-- Step 1: DNS & A Record -->
  <g transform="translate(35, 105)">
    <rect width="205" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#EFF6FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">01</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">DNS A Records</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Check Propagation:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Verify root and www A records</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check mail &amp; cpanel subdomains</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Confirm IPv4 matches VPS IP</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check authoritative nameserver</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#EFF6FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Align All Subdomains</text>
  </g>

  <!-- Step 2: CAA DNS Records -->
  <g transform="translate(263, 105)">
    <rect width="205" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#ECFDF5"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">02</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">CAA Constraints</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Verify Authority:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check dig CAA domain.com</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Allow letsencrypt.org</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Allow sectigo.com</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Remove blocking CAA tags</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#ECFDF5"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Authorize CA Provider</text>
  </g>

  <!-- Step 3: .htaccess & Redirects -->
  <g transform="translate(491, 105)">
    <rect width="205" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#FEF3C7"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">03</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">DCV Redirections</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Fix HTTP Token Path:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• /.well-known/acme-challenge/</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Exclude ACME from HTTPS 301</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Check Nginx / Apache rules</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Disable geo-blocking on token</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#FEF3C7"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Bypass ACME Path</text>
  </g>

  <!-- Step 4: Run AutoSSL via CLI -->
  <g transform="translate(719, 105)">
    <rect width="205" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#F3E8FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">04</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Force AutoSSL Run</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">CLI Execution:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• /scripts/run_autossl_user</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Monitor /var/cpanel/logs/autossl</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Certificate installs in ~15s</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• Automatic 90-day renewal</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#F3E8FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">Cert Verified &amp; Active</text>
  </g>
</svg>
