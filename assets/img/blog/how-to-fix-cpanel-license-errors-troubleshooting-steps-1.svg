<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">cPanel License Error Diagnostics &amp; Fix Steps</text>
  <text x="400" y="70" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Troubleshooting Cannot Read License Key &amp; Port 2087 Lockouts</text>
  <rect x="50" y="100" width="330" height="130" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="70" y="130" fill="#ef4444" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">1. Port 80/443 TCP Outbound</text>
  <text x="70" y="160" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Check firewall blocking license server sync</text>
  <text x="70" y="195" fill="#38bdf8" font-size="11" font-family="monospace">curl -I https://verify.cpanel.net</text>

  <rect x="420" y="100" width="330" height="130" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="440" y="130" fill="#ef4444" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">2. Force Key Refresh Command</text>
  <text x="440" y="160" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Synchronize local cache with verification IP</text>
  <text x="440" y="195" fill="#38bdf8" font-size="11" font-family="monospace">/usr/local/cpanel/cpkeyclt</text>

  <rect x="50" y="250" width="330" height="130" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="70" y="280" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">3. System Clock Drift &amp; NTP</text>
  <text x="70" y="310" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">SSL handshake fails if VPS clock is out of sync</text>
  <text x="70" y="345" fill="#38bdf8" font-size="11" font-family="monospace">chronyd -q 'server pool.ntp.org iburst'</text>

  <rect x="420" y="250" width="330" height="130" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="440" y="280" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">4. Public NAT IP Mismatch</text>
  <text x="440" y="310" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Verify outbound IP matches licensed server IP</text>
  <text x="440" y="345" fill="#38bdf8" font-size="11" font-family="monospace">curl -s https://api.ipify.org</text>
</svg>