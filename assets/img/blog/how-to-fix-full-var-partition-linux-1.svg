<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LINUX FILESYSTEM EMERGENCY RESPONSE</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Safely Reclaiming Space on a 100% Full /var Partition</text>

  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Why /var Fills Up</text>
  <text x="60" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/log/journal systemd bloat</text>
  <text x="60" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/cache/yum or dnf packages</text>
  <text x="60" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/lib/mysql binlogs</text>
  <text x="60" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• /var/spool/exim email queue</text>

  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Fast Safe Cleanup</text>
  <text x="310" y="175" fill="#94a3b8" font-family="monospace" font-size="10">journalctl --vacuum-size=200M</text>
  <text x="310" y="195" fill="#94a3b8" font-family="monospace" font-size="10">dnf clean all</text>
  <text x="310" y="215" fill="#94a3b8" font-family="monospace" font-size="10">find /var/log -type f -name "*.gz"</text>
  <text x="310" y="230" fill="#94a3b8" font-family="monospace" font-size="10">-delete</text>

  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">MySQL &amp; Mail Fixes</text>
  <text x="560" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Purge binary logs in MySQL:</text>
  <text x="560" y="195" fill="#38bdf8" font-family="monospace" font-size="10">PURGE BINARY LOGS BEFORE NOW();</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Clear frozen spam mail queue:</text>
  <text x="560" y="235" fill="#38bdf8" font-family="monospace" font-size="10">exim -bp | exiqgrep -i | xargs exim -Mrm</text>

  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Permanently Cap Journal Log Size:</text>
  <text x="60" y="340" fill="#22c55e" font-family="monospace" font-size="12">echo "SystemMaxUse=300M" &gt;&gt; /etc/systemd/journald.conf &amp;&amp; systemctl restart systemd-journald</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Prevents systemd system logs from ever consuming more than 300 megabytes on /var.</text>
</svg>