<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Linux VPS CPU &amp; RAM Diagnostic Blueprint</text>
  <text x="400" y="70" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Command Reference and AI-Assisted Root Cause Analysis</text>
  <rect x="50" y="100" width="330" height="125" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="70" y="130" fill="#ef4444" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">CPU Spike Diagnostics</text>
  <text x="70" y="160" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Inspect top threads, I/O wait &amp; runaway processes</text>
  <text x="70" y="195" fill="#38bdf8" font-size="11" font-family="monospace">htop -s PERCENT_CPU | pidstat -u 2 5</text>

  <rect x="420" y="100" width="330" height="125" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="440" y="130" fill="#ef4444" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Memory &amp; Cache Triage</text>
  <text x="440" y="160" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Differentiate true available RAM vs buff/cache</text>
  <text x="440" y="195" fill="#38bdf8" font-size="11" font-family="monospace">free -h | ps aux --sort=-%mem | head -n 10</text>

  <rect x="50" y="245" width="330" height="125" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="70" y="275" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Database Bottlenecks</text>
  <text x="70" y="305" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Identify unindexed full-table scan queries</text>
  <text x="70" y="340" fill="#38bdf8" font-size="11" font-family="monospace">mysqladmin proc stat | pt-query-digest</text>

  <rect x="420" y="245" width="330" height="125" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="440" y="275" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">AI Log Analysis Pipe</text>
  <text x="440" y="305" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Feed summarized stderr / dmesg to LLM CLI</text>
  <text x="440" y="340" fill="#38bdf8" font-size="11" font-family="monospace">dmesg -T | grep -i oom | ai-analyze</text>
</svg>