<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">WHM ACCOUNT SUSPENSION &amp; RECOVERY</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Safely Restoring Suspended Sites Without Data Loss</text>

  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Suspension State</text>
  <text x="60" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Web: Redirect to /suspended</text>
  <text x="60" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Shell: /bin/noshell</text>
  <text x="60" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Mail: Inbound Frozen</text>
  <text x="60" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Files: 100% Intact in /home</text>

  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="310" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Safety Backup First</text>
  <text x="310" y="175" fill="#94a3b8" font-family="monospace" font-size="11">/scripts/pkgacct USERNAME</text>
  <text x="310" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Generates cpmove archive</text>
  <text x="310" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Preserves MySQL &amp; SSL</text>
  <text x="310" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Safe offline backup ready</text>

  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Unsuspend Command</text>
  <text x="560" y="175" fill="#94a3b8" font-family="monospace" font-size="11">/scripts/unsuspendacct USER</text>
  <text x="560" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Restores Apache VirtualHost</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Unlocks FTP &amp; cPanel</text>
  <text x="560" y="235" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Site Live in 5 Seconds</text>

  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Check Suspension Reason via CLI:</text>
  <text x="60" y="340" fill="#38bdf8" font-family="monospace" font-size="12">cat /var/cpanel/suspended/USERNAME</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Reveals whether suspension was automated by billing (WHMCS), bandwidth overuse, or admin intervention.</text>
</svg>