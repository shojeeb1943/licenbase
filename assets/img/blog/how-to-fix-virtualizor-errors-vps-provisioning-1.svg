<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t5 d5">
  <title id="t5">Virtualizor VPS Provisioning Troubleshooting Flowchart</title>
  <desc id="d5">Step-by-step diagnostic tree for resolving Virtualizor storage pool, network bridge, and API errors.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="55" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Virtualizor VPS Provisioning Error Resolution Pipeline</text>

  <!-- Step 1: WHMCS / Order Trigger -->
  <rect x="40" y="90" width="180" height="110" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="130" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">1. API Trigger</text>
  <text x="130" y="150" font-family="Inter, sans-serif" font-size="12" fill="#3B82F6" text-anchor="middle">WHMCS creates VPS</text>
  <text x="130" y="170" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Port 4085 check</text>

  <!-- Arrow 1 -->
  <path d="M220 145 L255 145" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Storage Pool Check -->
  <rect x="260" y="90" width="190" height="110" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="355" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">2. Storage Pool</text>
  <text x="355" y="150" font-family="Inter, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">LVM / Thin / ZFS</text>
  <text x="355" y="170" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Fix: vgscan &amp; free space</text>

  <!-- Arrow 2 -->
  <path d="M450 145 L485 145" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 3: IP & Network Bridge -->
  <rect x="490" y="90" width="190" height="110" rx="8" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="585" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="middle">3. Bridge Network</text>
  <text x="585" y="150" font-family="Inter, sans-serif" font-size="12" fill="#DC2626" text-anchor="middle">viifbr0 / br0</text>
  <text x="585" y="170" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Fix: IP Pool &amp; Gateway</text>

  <!-- Arrow 3 -->
  <path d="M680 145 L715 145" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 4: OS Template Deploy -->
  <rect x="720" y="90" width="180" height="110" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="810" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">4. QEMU / KVM</text>
  <text x="810" y="150" font-family="Inter, sans-serif" font-size="12" fill="#059669" text-anchor="middle">VM Boots Online</text>
  <text x="810" y="170" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Template synced</text>

  <!-- Common Fixes Box Bottom -->
  <rect x="40" y="230" width="860" height="145" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="65" y="260" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Key Terminal Fix Commands for Virtualizor Administrators:</text>
  
  <rect x="65" y="275" width="380" height="35" rx="4" fill="#1E293B"/>
  <text x="75" y="297" font-family="Courier New, monospace" font-size="12" fill="#38BDF8">/usr/local/virtualizor/bin/virsh list --all</text>

  <rect x="475" y="275" width="400" height="35" rx="4" fill="#1E293B"/>
  <text x="485" y="297" font-family="Courier New, monospace" font-size="12" fill="#38BDF8">systemctl restart virtnetwork &amp;&amp; brctl show</text>

  <text x="65" y="340" font-family="Inter, sans-serif" font-size="12" fill="#475569">&bull; Check license key: <tspan font-family="Courier New, monospace" fill="#0F172A">php /usr/local/virtualizor/scripts/license.php</tspan></text>
  <text x="500" y="340" font-family="Inter, sans-serif" font-size="12" fill="#475569">&bull; Verify storage locks: <tspan font-family="Courier New, monospace" fill="#0F172A">lvs &amp;&amp; vgs</tspan></text>
</svg>