<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t17 d17">
  <title id="t17">cPanel and WHM Multi-Layer Security Hardening Matrix</title>
  <desc id="d17">Defense-in-depth model featuring cPHulk protection, two-factor authentication, SSH keys, and CSF/LFD firewall.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="35" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="50" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. cPHulk Daemon</text>
  <text x="50" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Brute-Force Shield</text>
  <path d="M50 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="50" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Block IP after 5 fails</text>
  <text x="50" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• One-day lockout window</text>
  <text x="50" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Protects cPanel, WHM &amp; SSH</text>
  <text x="50" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Admin IP whitelist</text>
  <rect x="50" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="137" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">WHM Native Defense</text>

  <rect x="260" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="275" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. 2FA Authentication</text>
  <text x="275" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">TOTP Token Protection</text>
  <path d="M275 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="275" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Enforce for root in WHM</text>
  <text x="275" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Google Auth / Authy app</text>
  <text x="275" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Neutralizes stolen passwords</text>
  <text x="275" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Emergency backup codes</text>
  <rect x="275" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="362" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Zero Credential Theft</text>

  <rect x="485" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. SSH Hardening</text>
  <text x="500" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Key-Only Access</text>
  <path d="M500 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="500" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Change port 22 to custom</text>
  <text x="500" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• PasswordAuthentication no</text>
  <text x="500" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• ED25519 key authentication</text>
  <text x="500" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• PermitRootLogin prohibit-pw</text>
  <rect x="485" y="315" width="205" height="36" rx="8" fill="#EFF6FF"/>
  <text x="587" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Terminal Locked</text>

  <rect x="710" y="40" width="215" height="340" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="725" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Imunify360 WAF</text>
  <text x="725" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#059669">AI-Powered Defense</text>
  <path d="M725 115 h185" stroke="#F1F5F9" stroke-width="1"/>
  <text x="725" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Real-time IP reputation ban</text>
  <text x="725" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Invisible CAPTCHA challenges</text>
  <text x="725" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Proactive malware scrubbing</text>
  <text x="725" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• LicenBase security stack</text>
  <rect x="725" y="315" width="185" height="36" rx="8" fill="#ECFDF5"/>
  <text x="817" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Total Perimeter Shield</text>
