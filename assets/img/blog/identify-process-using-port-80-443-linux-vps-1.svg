<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Linux VPS Port 80 and 443 Process Diagnostic Pipeline</title>
  <desc id="d2">Diagnostic command workflow using ss, lsof, and netstat to inspect PID listeners on HTTP Port 80 and HTTPS Port 443.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Linux VPS: Port 80 &amp; 443 Process Inspection Pipeline</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Diagnostic Pipeline</text>

  <!-- Step 1: ss command -->
  <g transform="translate(35, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#38BDF8"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">1. Fast Socket Check</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">ss utility (Recommended)</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">CLI Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">ss -tlpn '( sport = :80 or sport = :443 )'</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Expected Output</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">LISTEN :::80 :::443 users:(("httpd",pid=1234))</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">Kernel speed: Zero overhead</text>
    </g>
  </g>

  <!-- Step 2: lsof command -->
  <g transform="translate(262, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#10B981"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#34D399">2. Exact File &amp; PID</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">lsof utility</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">CLI Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#34D399">lsof -i :80 -i :443</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Diagnostic Value</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Shows command binary, PID, user, and socket state</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">Pinpoints exact daemon path</text>
    </g>
  </g>

  <!-- Step 3: Conflict Resolution -->
  <g transform="translate(489, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#F59E0B"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FBBF24">3. Common Collisions</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Rival Web Servers</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Typical Rival</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">Nginx, Apache, or Docker</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Resolution</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">systemctl stop nginx</text>
      <text x="10" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">systemctl disable nginx</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#38BDF8">Reclaims binding ports</text>
    </g>
  </g>

  <!-- Step 4: Web Server Restart -->
  <g transform="translate(715, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#A855F7"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#C084FC">4. Service Restart</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Clean Daemon Bind</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Apache / LSWS</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#C084FC">systemctl start lsws</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="70" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">cPanel Helper</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">/scripts/restartsrv_httpd</text>
    </g>
    <g transform="translate(14, 225)">
      <rect width="182" height="40" rx="6" fill="#0F172A"/>
      <text x="10" y="25" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#34D399">100% Operational Web Stack</text>
    </g>
  </g>
</svg>