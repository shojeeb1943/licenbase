  <line x1="0" y1="76" x2="960" y2="76" stroke="#1e293b" stroke-width="1"/>
  <text x="480" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">2026 Imunify360 Pricing Tiers & Return on Investment (ROI)</text>
  <text x="480" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Comprehensive comparison of retail pricing tiers, core feature modules, and wholesale licensing savings</text>

  
    <!-- Box 1: Retail Single User -->
    <g transform="translate(50, 96)" filter="url(#shadow)">
