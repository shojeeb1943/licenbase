<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d"><title id="t">Six steps to install and activate a cPanel license</title><desc id="d">Get a license for your server IP, set the hostname, update the system, run the installer, log in to WHM on port 2087 and verify the license.</desc><rect width="960" height="380" rx="20" fill="#F8FAFC"/><rect x="40" y="40" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="80" cy="85" r="20" fill="#1E40AF"/><text x="80" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="114" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Get a license</text><text x="70" y="140" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Bound to your server IP</text><path d="M326 110 l8 0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><rect x="340" y="40" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="380" cy="85" r="20" fill="#1E40AF"/><text x="380" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="414" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Set hostname</text><text x="370" y="140" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">FQDN with an A record</text><path d="M626 110 l8 0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><rect x="640" y="40" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="680" cy="85" r="20" fill="#1E40AF"/><text x="680" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="714" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Update system</text><text x="670" y="140" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Install perl and curl</text><rect x="40" y="210" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="80" cy="255" r="20" fill="#1E40AF"/><text x="80" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="114" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Run installer</text><text x="70" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Inside tmux or screen</text><path d="M326 280 l8 0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><rect x="340" y="210" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="380" cy="255" r="20" fill="#1E40AF"/><text x="380" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="414" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Log in to WHM</text><text x="370" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Port 2087 as root</text><path d="M626 280 l8 0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><rect x="640" y="210" width="280" height="140" rx="16" fill="#fff" stroke="#E2E8F0"/><circle cx="680" cy="255" r="20" fill="#1E40AF"/><text x="680" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="714" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Verify license</text><text x="670" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Run cpkeyclt</text></svg>