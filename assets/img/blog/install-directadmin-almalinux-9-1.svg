<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="40" y="40" width="880" height="340" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="85" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">DirectAdmin Installation Pipeline on AlmaLinux 9</text>
  <text x="480" y="112" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Clean OS Preparation to CustomBuild Stack Compilation</text>

  <rect x="70" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1. OS Prep</text>
  <text x="90" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Clean AlmaLinux 9</text>
  <text x="90" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Set FQDN hostname</text>
  <text x="90" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Update dnf packages</text>
  <text x="90" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Install perl &amp; wget</text>

  <rect x="285" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="375" y="180" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. Firewall &amp; Net</text>
  <text x="305" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Open port 2222</text>
  <text x="305" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Open 80, 443, 53</text>
  <text x="305" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Open Mail 25, 587</text>
  <text x="305" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• firewalld / csf ready</text>

  <rect x="500" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="180" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. Setup Script</text>
  <text x="520" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Fetch setup.sh</text>
  <text x="520" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Run auto installer</text>
  <text x="520" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Bind license key / IP</text>
  <text x="520" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Auto daemon build</text>

  <rect x="715" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="805" y="180" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4. CustomBuild</text>
  <text x="735" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Apache / Nginx / LS</text>
  <text x="735" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Multi-PHP 8.1 - 8.4</text>
  <text x="735" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• MariaDB 10.11+</text>
  <text x="735" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Evolution theme UI</text>
</svg>