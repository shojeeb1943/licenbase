<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="40" y="40" width="880" height="340" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="85" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">LiteSpeed Web Server Deployment on cPanel &amp; WHM</text>
  <text x="480" y="112" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Zero Downtime Migration from Apache with Native LSCache Acceleration</text>

  <rect x="70" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1. Install Plugin</text>
  <text x="90" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Run lsws_whm_plugin</text>
  <text x="90" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Registers in WHM menu</text>
  <text x="90" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Auto license check</text>
  <text x="90" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Ready for compile</text>

  <rect x="285" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="375" y="180" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. Install LSWS</text>
  <text x="305" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Run binary installation</text>
  <text x="305" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Build PHP with LSAPI</text>
  <text x="305" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Match EasyApache config</text>
  <text x="305" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Port offset testing (7080)</text>

  <rect x="500" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="180" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. Switch to LSWS</text>
  <text x="520" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 1-click Switch in WHM</text>
  <text x="520" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Zero downtime transition</text>
  <text x="520" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Seamless .htaccess read</text>
  <text x="520" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Native HTTP/3 QUIC</text>

  <rect x="715" y="145" width="180" height="200" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="805" y="180" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4. LSCache Mass</text>
  <text x="735" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• WHM LSCache manager</text>
  <text x="735" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Auto scan WP installs</text>
  <text x="735" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Mass enable caching</text>
  <text x="735" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Up to 10x PHP speedup</text>
</svg>