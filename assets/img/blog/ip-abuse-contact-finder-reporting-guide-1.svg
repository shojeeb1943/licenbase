  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bgabuseip)"/>
  <text x="400" y="45" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" text-anchor="middle">IP Abuse Contact Finder & Incident Reporting Workflow</text>
  <text x="400" y="72" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">WHOIS Lookups, Regional Registries (RIRs), and Stopping VPS Attacks</text>

