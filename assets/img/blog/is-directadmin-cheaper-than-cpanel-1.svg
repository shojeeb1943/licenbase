<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="40" y="40" width="880" height="340" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="85" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">DirectAdmin vs cPanel: 5-Year Total Cost Analysis</text>
  <text x="480" y="112" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Scale Comparison Across 100, 500, and 1,000 Hosted Accounts</text>

  <rect x="70" y="145" width="380" height="205" rx="10" fill="#0F172A" stroke="#FF6C2C" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" fill="#FF6C2C" font-family="system-ui, sans-serif" font-size="16" font-weight="700">cPanel Scaling Cost Model</text>
  <text x="90" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 100 Accounts: Premier VPS ~$45–$60/mo</text>
  <text x="90" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 500 Accounts: ~$180–$220/mo (per-account fees)</text>
  <text x="90" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 1,000 Accounts: ~$380–$450/mo</text>
  <text x="90" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Hardware: 4GB - 8GB base RAM allocation</text>
  <rect x="90" y="310" width="340" height="24" rx="6" fill="#FF6C2C" fill-opacity="0.15"/>
  <text x="260" y="326" text-anchor="middle" fill="#FF8A50" font-family="system-ui, sans-serif" font-size="11" font-weight="600">High Brand Trust · Per-Account Costs at Scale</text>

  <rect x="510" y="145" width="380" height="205" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="700" y="180" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">DirectAdmin Scaling Cost Model</text>
  <text x="530" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 100 Accounts: Standard Flat ~$15–$29/mo</text>
  <text x="530" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 500 Accounts: Standard Flat ~$15–$29/mo (No tier cap)</text>
  <text x="530" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 1,000 Accounts: Standard Flat ~$15–$29/mo (Unlimited)</text>
  <text x="530" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Hardware: 1GB - 2GB RAM allocation (Lean)</text>
  <rect x="530" y="310" width="340" height="24" rx="6" fill="#10B981" fill-opacity="0.15"/>
  <text x="700" y="326" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Predictable Fixed Overhead · Up to 80% Cost Savings</text>
</svg>