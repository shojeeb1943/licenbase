<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t4 d4">
  <title id="t4">Apache vs LiteSpeed WordPress Performance and Cost Comparison</title>
  <desc id="d4">Performance benchmark comparing Apache with PHP-FPM versus LiteSpeed Web Server with LSCache under high concurrent traffic.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Is LiteSpeed Worth It for WordPress? Apache vs. LiteSpeed</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Benchmark &amp; ROI</text>

  <!-- Left: Apache + PHP-FPM -->
  <g transform="translate(35, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#EF4444"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#EF4444">Apache 2.4 + PHP-FPM (Traditional Stack)</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Process-bound event loop with file-based page caching</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">TTFB Under Concurrency: <tspan fill="#F87171" font-weight="600">450 ms - 950 ms</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Peak Requests / Second: <tspan fill="#F87171" font-weight="600">~600 - 1,200 RPS before saturation</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Memory Overhead: <tspan fill="#F87171" font-weight="600">High (Workers hold 40-70 MB RAM each)</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Hardware Requirement: <tspan fill="#F87171" font-weight="600">Requires 8-16 GB RAM VPS for bursts</tspan></text>
    </g>
  </g>

  <!-- Right: LiteSpeed + LSCache -->
  <g transform="translate(495, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#10B981"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#34D399">LiteSpeed Web Server + LSCache Plugin</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Event-driven I/O engine with server-level tag caching</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">TTFB Under Concurrency: <tspan fill="#34D399" font-weight="600">45 ms - 110 ms (Sub-second Core Web Vitals)</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Peak Requests / Second: <tspan fill="#34D399" font-weight="600">5,000 - 8,500+ RPS (5x - 7x faster)</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Memory Overhead: <tspan fill="#34D399" font-weight="600">Ultralight (Direct LSAPI memory mapping)</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Hardware Savings: <tspan fill="#34D399" font-weight="700">Runs massive traffic on $10-$20 VPS nodes</tspan></text>
    </g>
  </g>
</svg>