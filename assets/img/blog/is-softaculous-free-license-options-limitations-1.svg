<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Softaculous Free vs Premium Tier Comparison</text>
  <text x="400" y="70" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Catalog Access, Staging Engines, Automated Backups &amp; WordPress Tools</text>
  <rect x="50" y="100" width="330" height="270" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" rx="8"/>
  <text x="215" y="135" fill="#94a3b8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Softaculous Free Edition</text>
  <text x="80" y="175" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Limited to ~50 basic scripts</text>
  <text x="80" y="205" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• No 1-click WordPress staging</text>
  <text x="80" y="235" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• No automated remote S3/Google backups</text>
  <text x="80" y="265" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Incomplete application catalog</text>
  <text x="80" y="295" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Restricted WordPress Manager tools</text>
  <text x="215" y="340" fill="#94a3b8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Free But Heavily Restricted</text>

  <rect x="420" y="100" width="330" height="270" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="585" y="135" fill="#10b981" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Softaculous Premium (LicenBase)</text>
  <text x="450" y="175" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Full access to 450+ 1-click scripts</text>
  <text x="450" y="205" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 1-Click WordPress Clone &amp; Staging</text>
  <text x="450" y="235" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Automated Google Drive &amp; S3 backups</text>
  <text x="450" y="265" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Nightly security updates via cron</text>
  <text x="450" y="295" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Full WordPress Manager integration</text>
  <text x="585" y="340" fill="#10b981" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">LicenBase: $1.50/mo (Save 60%)</text>
</svg>