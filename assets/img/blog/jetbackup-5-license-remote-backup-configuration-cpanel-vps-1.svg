<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg6)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">JetBackup 5 Architecture: Offsite Destination &amp; Snapshot Restore</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Multi-threaded block-level snapshots, cloud object storage, and granular enduser cPanel self-restore</text>

  <!-- Step 1: Production Server -->
  <rect x="50" y="125" width="250" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="250" height="40" rx="12" fill="#0284c7"/>
  <text x="175" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cPanel Production VPS</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• JetBackup 5 Daemon</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Block-level change tracking</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Zero MySQL lock tables</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Configurable I/O nice priorities</text>
  <text x="75" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Near-Zero Server Load</text>

  <!-- Arrow -->
  <path d="M 310 240 L 360 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 2: Offsite Storage Destination -->
  <rect x="370" y="125" width="250" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="370" y="125" width="250" height="40" rx="12" fill="#059669"/>
  <text x="495" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Offsite Destination (S3 / SFTP)</text>
  <text x="395" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• AWS S3 / Wasabi / Backblaze B2</text>
  <text x="395" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Dedicated Storage Box (SFTP/SSH)</text>
  <text x="395" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• AES-256 client-side encryption</text>
  <text x="395" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Custom point-in-time retention</text>
  <text x="395" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ransomware-Proof Isolation</text>

  <!-- Arrow -->
  <path d="M 630 240 L 680 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 3: Granular Self-Restore -->
  <rect x="690" y="125" width="220" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="690" y="125" width="220" height="40" rx="12" fill="#d97706"/>
  <text x="800" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Enduser Self-Restore</text>
  <text x="710" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Single MySQL DB restore</text>
  <text x="710" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Specific file / directory roll</text>
  <text x="710" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Email accounts &amp; DNS zones</text>
  <text x="710" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Complete account snapshot</text>
  <text x="710" y="325" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zero Admin Support Tickets</text>
</svg>
