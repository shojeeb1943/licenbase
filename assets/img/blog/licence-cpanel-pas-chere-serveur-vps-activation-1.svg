<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t12 d12">
  <title id="t12">Activation de Licence cPanel Pas Chere pour Serveur VPS</title>
  <desc id="d12">Processus d'activation d'une licence cPanel par adresse IP sur VPS Linux.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="55" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Activation de Licence cPanel Pas Chère : Étapes VPS</text>

  <!-- Step 1 -->
  <rect x="50" y="85" width="255" height="150" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="177" y="115" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">1. Commande LicenBase</text>
  <text x="177" y="145" font-family="Inter, sans-serif" font-size="13" fill="#3B82F6" text-anchor="middle">Indiquez l'adresse IPv4</text>
  <text x="177" y="170" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Paiement sécurisé instantané</text>
  <text x="177" y="205" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">Dès 4,00 $ / mois</text>

  <!-- Step 2 -->
  <rect x="350" y="85" width="255" height="150" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
  <text x="477" y="115" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="middle">2. Connexion SSH Root</text>
  <text x="477" y="145" font-family="Inter, sans-serif" font-size="13" fill="#7C3AED" text-anchor="middle">Collez la commande unique</text>
  <text x="477" y="170" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Téléchargement des clés officielles</text>
  <text x="477" y="205" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="middle">Installation en 30 sec</text>

  <!-- Step 3 -->
  <rect x="650" y="85" width="255" height="150" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="777" y="115" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle">3. Vérification WHM</text>
  <text x="777" y="145" font-family="Inter, sans-serif" font-size="13" fill="#059669" text-anchor="middle">Exécutez cpkeyclt</text>
  <text x="777" y="170" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Mises à jour vendor directes</text>
  <text x="777" y="205" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">Licence 100% Active</text>

  <!-- Bottom Command Card -->
  <rect x="50" y="260" width="855" height="115" rx="8" fill="#0F172A"/>
  <text x="75" y="290" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">Commande officielle de synchronisation de licence Linux :</text>
  <rect x="75" y="305" width="805" height="35" rx="4" fill="#1E293B"/>
  <text x="90" y="327" font-family="Courier New, monospace" font-size="13" fill="#4ADE80">/usr/local/cpanel/cpkeyclt</text>
  <text x="75" y="358" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Zéro modification des binaires officiels cPanel &bull; Mises à jour automatisées</text>
</svg>