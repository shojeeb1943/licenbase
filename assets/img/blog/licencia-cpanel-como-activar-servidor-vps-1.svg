<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="6" fill="url(#accentGrad)"/>

  <!-- Grid Decoration -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- Header Badge -->
  <rect x="48" y="32" width="280" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="188" y="49" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">GUÍA DE ACTIVACIÓN EN ESPAÑOL</text>

  <!-- Title & Subtitle -->
  <text x="48" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Flujo de Activación de Licencia cPanel en VPS</text>
  <text x="48" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Comandos de terminal, verificación de IP y configuración inicial</text>

  <!-- 3 Main Architecture Cards -->
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="48" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="48" y="186" width="266" height="1" fill="#334155"/>
    <text x="68" y="172" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. Verificación de IP</text>
    <g transform="translate(68, 212)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ordenar en LicenBase ($4.00/mes)</text>
      <circle cx="0" cy="46" r="4" fill="#38bdf8"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Vincular IP pública estática del VPS</text>
      <circle cx="0" cy="92" r="4" fill="#38bdf8"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Activación automática en segundos</text>
      <circle cx="0" cy="138" r="4" fill="#38bdf8"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Comprobar salida de puertos 80 y 443</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="347" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="347" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="347" y="186" width="266" height="1" fill="#6366f1"/>
    <text x="367" y="172" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. Comando en Terminal</text>
    <g transform="translate(367, 212)">
      <circle cx="0" cy="0" r="4" fill="#818cf8"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Conectar por SSH como usuario root</text>
      <circle cx="0" cy="46" r="4" fill="#818cf8"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ejecutar /usr/local/cpanel/cpkeyclt</text>
      <circle cx="0" cy="92" r="4" fill="#818cf8"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Sincronizar con servidores de licencia</text>
      <circle cx="0" cy="138" r="4" fill="#818cf8"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Confirmación: 'License status: active'</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="646" y="145" width="266" height="280" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="646" y="145" width="266" height="42" rx="12" fill="#1e293b"/>
    <rect x="646" y="186" width="266" height="1" fill="#334155"/>
    <text x="666" y="172" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. Verificación en WHM</text>
    <g transform="translate(666, 212)">
      <circle cx="0" cy="0" r="4" fill="#34d399"/>
      <text x="14" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ingresar a https://IP-del-servidor:2087</text>
      <circle cx="0" cy="46" r="4" fill="#34d399"/>
      <text x="14" y="50" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Revisar el estado de la licencia activa</text>
      <circle cx="0" cy="92" r="4" fill="#34d399"/>
      <text x="14" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Configurar EasyApache 4 y PHP-FPM</text>
      <circle cx="0" cy="138" r="4" fill="#34d399"/>
      <text x="14" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Servidor listo para alojar clientes</text>
    </g>
  </g>

  <!-- Footer Brand Tag -->
  <rect x="48" y="445" width="864" height="32" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="64" y="465" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">LicenBase Technical Infrastructure Architecture | Genuine Automated Wholesale Software Licenses</text>
  <text x="896" y="465" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">licenbase.com</text>
</svg>