<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t19 d19">
  <title id="t19">Guía de Selección de Licencias cPanel para VPS</title>
  <desc id="d19">Comparativa de niveles de licencia cPanel Solo, Admin y Pro para servidores privados virtuales en español.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="40" y="35" width="260" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="35" width="260" height="6" rx="3" fill="#3B82F6"/>
  <text x="60" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">cPanel Solo</text>
  <text x="60" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">1 Cuenta cPanel</text>
  <path d="M60 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Ideal para desarrolladores y tiendas</text>
  <text x="60" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Acceso completo a WHM root</text>
  <text x="60" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Menor consumo de memoria RAM</text>
  <text x="60" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Activación instantánea por IP</text>
  <rect x="60" y="310" width="220" height="38" rx="8" fill="#EFF6FF"/>
  <text x="170" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Plan Inicial Económico</text>

  <rect x="350" y="35" width="260" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="350" y="35" width="260" height="6" rx="3" fill="#2563EB"/>
  <text x="370" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">cPanel Admin</text>
  <text x="370" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">Hasta 5 Cuentas</text>
  <path d="M370 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="370" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Agencias web y empresas digitales</text>
  <text x="370" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Aislamiento independiente de clientes</text>
  <text x="370" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Compatible con LiteSpeed Web Server</text>
  <text x="370" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Coste reducido sin intermediarios</text>
  <rect x="370" y="310" width="220" height="38" rx="8" fill="#EFF6FF"/>
  <text x="480" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Agencias en Crecimiento</text>

  <rect x="660" y="35" width="260" height="350" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="660" y="35" width="260" height="6" rx="3" fill="#10B981"/>
  <text x="680" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">cPanel Pro / Premier</text>
  <text x="680" y="95" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#059669">30 a 100+ Cuentas</text>
  <path d="M680 115 h220" stroke="#F1F5F9" stroke-width="1"/>
  <text x="680" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Proveedores de hosting revendedor</text>
  <text x="680" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Licencia mayorista con LicenBase</text>
  <text x="680" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Binarios oficiales sin modificaciones</text>
  <text x="680" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Actualizaciones automáticas directas</text>
  <rect x="660" y="310" width="260" height="38" rx="8" fill="#ECFDF5"/>
  <text x="790" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Ahorro hasta el 70%</text>
</svg>