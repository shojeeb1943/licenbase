<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">EXIM &amp; POSTFIX ABUSE TRIAGE</text>
  <text x="40" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Tracking &amp; Neutralizing Outbound Email Spam</text>

  <!-- Step 1: Queue Inspection -->
  <rect x="40" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Queue Inspection</text>
  <text x="60" y="175" fill="#94a3b8" font-family="monospace" font-size="10">exim -bpr | exiqsumm</text>
  <text x="60" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Check top sending domains</text>
  <text x="60" y="215" fill="#94a3b8" font-family="monospace" font-size="10">exim -Mvh &lt;message-id&gt;</text>
  <text x="60" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Inspect headers &amp; auth_id</text>

  <!-- Step 2: Source Attribution -->
  <rect x="290" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Source Attribution</text>
  <text x="310" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Script Leak (PHP mail):</text>
  <text x="310" y="195" fill="#94a3b8" font-family="monospace" font-size="9">X-PHP-Originating-Script</text>
  <text x="310" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Stolen Mail Password:</text>
  <text x="310" y="235" fill="#94a3b8" font-family="monospace" font-size="9">grep "login:" /var/log/maillog</text>

  <!-- Step 3: Immediate Mitigation -->
  <rect x="540" y="115" width="220" height="150" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="145" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Fast Mitigation</text>
  <text x="560" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Purge frozen / spam queue:</text>
  <text x="560" y="195" fill="#38bdf8" font-family="monospace" font-size="9">exiqgrep -z -i | xargs exim -Mrm</text>
  <text x="560" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Suspend compromised mailbox</text>
  <text x="560" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Quarantine abusive PHP webshell</text>

  <!-- Step 4: Long-term Hardening -->
  <rect x="40" y="285" width="720" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Permanent Defenses &amp; Reputation Protection:</text>
  <text x="60" y="340" fill="#22c55e" font-family="monospace" font-size="12">whmapi1 set_email_limits user=target_account max_deferfail_percentage=10 max_emails_per_hour=100</text>
  <text x="60" y="360" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Enforce hourly rate limits, verify rDNS + SPF/DKIM/DMARC records, and route outbound via authenticated smart host.</text>
</svg>
