<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t14 d14">
  <title id="t14">Panduan Memilih Lisensi cPanel Murah untuk Server VPS</title>
  <desc id="d14">Perbandingan tier lisensi cPanel VPS Solo, Admin, dan Pro untuk hosting Indonesia.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="55" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Lisensi cPanel Murah: Cara Memilih untuk Server VPS</text>

  <!-- Card 1: Solo -->
  <rect x="45" y="85" width="265" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="45" y="85" width="265" height="6" rx="3" fill="#3B82F6"/>
  <text x="177" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">cPanel Solo</text>
  <text x="177" y="155" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle">1 Akun</text>
  <line x1="65" y1="175" x2="290" y2="175" stroke="#E2E8F0"/>
  <text x="65" y="205" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; Website toko online mandiri</text>
  <text x="65" y="235" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; Server staging / developer</text>
  <text x="65" y="265" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; Bebas repot maintenance</text>
  <rect x="65" y="305" width="225" height="40" rx="6" fill="#EFF6FF"/>
  <text x="177" y="330" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">LicenBase: $4.00/bln</text>

  <!-- Card 2: Admin -->
  <rect x="345" y="85" width="265" height="280" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <rect x="345" y="85" width="265" height="6" rx="3" fill="#10B981"/>
  <text x="477" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">cPanel Admin (Favorit)</text>
  <text x="477" y="155" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#047857" text-anchor="middle">Hingga 5 Akun</text>
  <line x1="365" y1="175" x2="590" y2="175" stroke="#BBF7D0"/>
  <text x="365" y="205" font-family="Inter, sans-serif" font-size="13" fill="#166534">&bull; Agensi web &amp; software house</text>
  <text x="365" y="235" font-family="Inter, sans-serif" font-size="13" fill="#166534">&bull; Akses root WHM penuh</text>
  <text x="365" y="265" font-family="Inter, sans-serif" font-size="13" fill="#166534">&bull; Dukungan LiteSpeed &amp; CloudLinux</text>
  <rect x="365" y="305" width="225" height="40" rx="6" fill="#10B981"/>
  <text x="477" y="330" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LicenBase: $4.00/bln</text>

  <!-- Card 3: Pro -->
  <rect x="645" y="85" width="265" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="645" y="85" width="265" height="6" rx="3" fill="#6366F1"/>
  <text x="777" y="125" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#3730A3" text-anchor="middle">cPanel Pro</text>
  <text x="777" y="155" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle">Hingga 30 Akun</text>
  <line x1="665" y1="175" x2="890" y2="175" stroke="#E2E8F0"/>
  <text x="665" y="205" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; Reseller hosting pemula</text>
  <text x="665" y="235" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; Lisensi IP instan otomatis</text>
  <text x="665" y="265" font-family="Inter, sans-serif" font-size="13" fill="#475569">&bull; 100% binary resmi &amp; aman</text>
  <rect x="665" y="305" width="225" height="40" rx="6" fill="#EEF2FF"/>
  <text x="777" y="330" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#4338CA" text-anchor="middle">LicenBase: $4.00/bln</text>
</svg>