<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t1 d1">
  <title id="t1">LiteSpeed 2-Core vs 4-Core VPS Pricing Breakdown</title>
  <desc id="d1">Comparison matrix of LiteSpeed 2-Core versus 4-Core VPS licenses detailing worker threads, memory limits, and pricing.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">LiteSpeed Web Server: 2-Core vs. 4-Core VPS Editions</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">License Sizing</text>

  <!-- Left: 2-Core License -->
  <g transform="translate(35, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#38BDF8"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">LiteSpeed Web Server (2-Core VPS)</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Optimized for small-to-midsize WordPress instances &amp; VPS</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Worker Threads: <tspan fill="#38BDF8" font-weight="600">2 Dedicated LSWS Worker Processes</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">RAM Allocation: <tspan fill="#38BDF8" font-weight="600">Up to 8 GB Server Memory Supported</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">LicenBase Wholesale Cost: <tspan fill="#34D399" font-weight="600">$7.50 / mo (Retail $18.00)</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Traffic Capacity: <tspan fill="#38BDF8" font-weight="600">Up to 250,000 monthly pageviews</tspan></text>
    </g>
  </g>

  <!-- Right: 4-Core License -->
  <g transform="translate(495, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#10B981"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#34D399">LiteSpeed Web Server (4-Core VPS)</text>
    <text x="25" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">High-concurrency e-commerce &amp; shared hosting clusters</text>

    <g transform="translate(25, 75)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Worker Threads: <tspan fill="#34D399" font-weight="600">4 Dedicated LSWS Worker Processes</tspan></text>
    </g>
    <g transform="translate(25, 123)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">RAM Allocation: <tspan fill="#34D399" font-weight="600">Unlimited System RAM Utilization</tspan></text>
    </g>
    <g transform="translate(25, 171)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">LicenBase Wholesale Cost: <tspan fill="#34D399" font-weight="600">$10.50 / mo (Retail $26.00)</tspan></text>
    </g>
    <g transform="translate(25, 219)">
      <rect width="380" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#E2E8F0">Traffic Capacity: <tspan fill="#34D399" font-weight="600">1,000,000+ monthly pageviews (Burst Ready)</tspan></text>
    </g>
  </g>
</svg>