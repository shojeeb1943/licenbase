<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">LiteSpeed Enterprise vs Free Web Servers</title>
  <desc id="d">Feature comparison of LiteSpeed Enterprise vs Apache, Nginx, and OpenLiteSpeed.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="50" y="45" width="410" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="50" y="45" width="410" height="6" rx="3" fill="#64748B"/>
  <text x="75" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Free Web Servers (Apache / NGINX)</text>
  <path d="M75 105 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="75" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Apache: Process-based, heavy RAM consumption</text>
  <text x="75" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• NGINX: No native .htaccess support</text>
  <text x="75" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Manual reverse proxy and fastcgi cache setup</text>
  <text x="75" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• OpenLiteSpeed: Requires restart on .htaccess edits</text>
  <rect x="75" y="275" width="360" height="45" rx="8" fill="#F1F5F9"/>
  <text x="255" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Higher Maintenance &amp; Memory Overhead</text>

  <rect x="500" y="45" width="410" height="330" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="500" y="45" width="410" height="6" rx="3" fill="#10B981"/>
  <text x="525" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">LiteSpeed Enterprise ($4.00/mo)</text>
  <path d="M525 105 h360" stroke="#F1F5F9" stroke-width="1"/>
  <text x="525" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• 100% Drop-in Apache .htaccess compatibility</text>
  <text x="525" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Built-in Server-Level LSCache Engine</text>
  <text x="525" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Native HTTP/3 QUIC and anti-DDoS stream filters</text>
  <text x="525" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Zero-downtime graceful config reloading</text>
  <rect x="525" y="275" width="360" height="45" rx="8" fill="#ECFDF5"/>
  <text x="705" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Up to 10x Faster Dynamic PHP Response</text>
</svg>