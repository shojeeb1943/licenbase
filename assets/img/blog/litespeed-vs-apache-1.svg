<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Apache versus LiteSpeed connection handling</title><desc id="d">Apache dedicates a worker process or thread to each connection while LiteSpeed serves many connections from a few event-driven processes.</desc><rect width="960" height="420" rx="20" fill="#F8FAFC"/><rect x="40" y="40" width="420" height="340" rx="16" fill="#fff" stroke="#E2E8F0"/><text x="70" y="90" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="start">Apache</text><circle cx="90" cy="130" r="12" fill="#CBD5E1"/><circle cx="90" cy="170" r="12" fill="#CBD5E1"/><circle cx="90" cy="210" r="12" fill="#CBD5E1"/><circle cx="90" cy="250" r="12" fill="#CBD5E1"/><circle cx="90" cy="290" r="12" fill="#CBD5E1"/><circle cx="90" cy="330" r="12" fill="#CBD5E1"/><rect x="500" y="40" width="420" height="340" rx="16" fill="#fff" stroke="#E2E8F0"/><text x="530" y="90" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="start">LiteSpeed</text><circle cx="550" cy="130" r="12" fill="#CBD5E1"/><circle cx="550" cy="170" r="12" fill="#CBD5E1"/><circle cx="550" cy="210" r="12" fill="#CBD5E1"/><circle cx="550" cy="250" r="12" fill="#CBD5E1"/><circle cx="550" cy="290" r="12" fill="#CBD5E1"/><circle cx="550" cy="330" r="12" fill="#CBD5E1"/><rect x="300" y="116" width="90" height="28" rx="8" fill="#1E40AF"/><text x="345" y="135" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">worker</text><path d="M90 130 H300" stroke="#CBD5E1" stroke-width="2"/><rect x="300" y="156" width="90" height="28" rx="8" fill="#1E40AF"/><text x="345" y="175" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">worker</text><path d="M90 170 H300" stroke="#CBD5E1" stroke-width="2"