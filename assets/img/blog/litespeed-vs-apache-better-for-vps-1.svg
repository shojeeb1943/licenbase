<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">LiteSpeed vs Apache Architecture Comparison for VPS</title>
  <desc id="d">Technical comparison of LiteSpeed event-driven architecture vs Apache process model.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="60" y="45" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="60" y="45" width="390" height="6" rx="3" fill="#DC2626"/>
  <text x="85" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Apache HTTP Server</text>
  <path d="M85 105 h340" stroke="#F1F5F9" stroke-width="1"/>
  <text x="85" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Prefork / Event MPM with process overhead</text>
  <text x="85" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Spawns new worker threads per visitor connection</text>
  <text x="85" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• High RAM spikes during traffic surges</text>
  <text x="85" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Requires third-party Varnish or Redis caching</text>
  <rect x="85" y="275" width="340" height="45" rx="8" fill="#FEE2E2"/>
  <text x="255" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">Heavy RAM Footprint on Small VPS</text>

  <rect x="510" y="45" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="510" y="45" width="390" height="6" rx="3" fill="#10B981"/>
  <text x="535" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">LiteSpeed Web Server</text>
  <path d="M535 105 h340" stroke="#F1F5F9" stroke-width="1"/>
  <text x="535" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Asynchronous event-driven I/O engine</text>
  <text x="535" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Serves thousands of connections on single worker</text>
  <text x="535" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Built-in Server-Level LSCache for WordPress</text>
  <text x="535" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• 100% Drop-in replacement for Apache .htaccess</text>
  <rect x="535" y="275" width="340" height="45" rx="8" fill="#ECFDF5"/>
  <text x="705" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">70% Less RAM &amp; 4x Faster Concurrency</text>
</svg>