<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">LiteSpeed vs Nginx Performance &amp; Features</title>
  <desc id="d">Comparison of LiteSpeed Enterprise vs Nginx for shared hosting and WordPress.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="60" y="45" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="60" y="45" width="390" height="6" rx="3" fill="#3B82F6"/>
  <text x="85" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">NGINX Web Server</text>
  <path d="M85 105 h340" stroke="#F1F5F9" stroke-width="1"/>
  <text x="85" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Asynchronous event-driven static serving</text>
  <text x="85" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• No native .htaccess support (rewrite rules in conf)</text>
  <text x="85" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Requires PHP-FPM fastcgi proxy configuration</text>
  <text x="85" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Free open-source or NGINX Plus ($3,850/yr)</text>
  <rect x="85" y="275" width="340" height="45" rx="8" fill="#EFF6FF"/>
  <text x="255" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Best for Custom Microservices &amp; Reverse Proxy</text>

  <rect x="510" y="45" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="510" y="45" width="390" height="6" rx="3" fill="#10B981"/>
  <text x="535" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0F172A">LiteSpeed Enterprise ($4.00/mo)</text>
  <path d="M535 105 h340" stroke="#F1F5F9" stroke-width="1"/>
  <text x="535" y="135" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Reads Apache httpd.conf &amp; .htaccess directly</text>
  <text x="535" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Direct LiteSpeed SAPI (LSAPI) for PHP</text>
  <text x="535" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• Built-in ESI &amp; Purge cache for WordPress/Woo</text>
  <text x="535" y="225" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#475569">• 1-click switch in cPanel / Plesk WHM</text>
  <rect x="535" y="275" width="340" height="45" rx="8" fill="#ECFDF5"/>
  <text x="705" y="303" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">Best for Shared Hosting, Resellers &amp; WordPress</text>
</svg>