    <rect width="205" height="6" rx="3" fill="#A855F7"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Web Host Elite</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#A855F7">$5.00<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Unlimited Domains</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Multi-Worker (2-4+)</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Unlimited Server RAM</text>
