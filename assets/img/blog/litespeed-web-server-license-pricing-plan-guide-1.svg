    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#38BDF8">$0<tspan font-size="11" font-weight="400" fill="#94A3B8">/mo</tspan></text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
