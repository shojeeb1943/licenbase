    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Shared hosting VPS</text>
    <text x="20" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Drop-in Apache swap</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">Web Hosting VPS</text>
