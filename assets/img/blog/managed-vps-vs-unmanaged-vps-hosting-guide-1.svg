<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Managed VPS vs Unmanaged VPS Responsibility Matrix</title>
  <desc id="d">Comparison of technical responsibilities, cost structure, and administrative control between managed VPS and unmanaged VPS hosting.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Managed VPS vs Unmanaged VPS: Responsibility Matrix</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Decision Guide</text>

  <!-- Left: Managed VPS -->
  <g transform="translate(35, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#10B981"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10B981">Managed VPS Hosting (Hands-Off Peace of Mind)</text>
    <text x="25" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Host handles all server architecture, maintenance &amp; security</text>
    <path d="M25 76 h380" stroke="#334155" stroke-width="1"/>
    <text x="25" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Setup &amp; Hardening: CSF firewall, AutoSSL, kernel patching</text>
    <text x="25" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Software Bundling: Pre-installed cPanel, LiteSpeed &amp; PHP-FPM</text>
    <text x="25" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ 24/7 Monitoring: Automated alerts, crash recovery &amp; backups</text>
    <text x="25" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Best For: Non-technical founders, busy agencies, e-commerce</text>
    <rect x="25" y="226" width="380" height="38" rx="8" fill="#0F172A"/>
    <text x="215" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">Effort: 0 hrs/mo | Focus on Business</text>
  </g>

  <!-- Right: Unmanaged VPS -->
  <g transform="translate(495, 104)">
    <rect width="430" height="280" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect width="430" height="6" rx="3" fill="#F59E0B"/>
    <text x="25" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F59E0B">Unmanaged VPS Hosting (Total Freedom &amp; Low Cost)</text>
    <text x="25" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Provider supplies raw cloud compute; customer manages the OS</text>
    <path d="M25 76 h380" stroke="#334155" stroke-width="1"/>
    <text x="25" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">⚙ Full Root Shell: Custom Linux kernels, Docker, Python daemons</text>
    <text x="25" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">⚙ Lowest Price: Pay strictly for hardware compute ($4.50 - $15/mo)</text>
    <text x="25" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✖ Self Maintenance: You configure firewalls, backups &amp; updates</text>
    <text x="25" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#CBD5E1">✔ Best For: Experienced sysadmins, DevOps engineers, developers</text>
    <rect x="25" y="226" width="380" height="38" rx="8" fill="#0F172A"/>
    <text x="215" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">Effort: 5-15 hrs/mo | Total Root Freedom</text>
  </g>
</svg>