<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg4)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Managed vs. Unmanaged VPS: Total Cost of Ownership (TCO)</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Comparing monthly hardware, software licensing, labor hours, and security responsibilities</text>

  <!-- Column 1: Unmanaged VPS -->
  <rect x="50" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="50" y="125" width="410" height="40" rx="12" fill="#d97706"/>
  <text x="255" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Unmanaged VPS (DIY Sysadmin)</text>
  <text x="75" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• Low base hardware fee ($10 - $25/mo)</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Separate software licensing: cPanel, CloudLinux</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Manual patching, firewall hardening, &amp; reboot triage</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Estimated engineer labor: 4 - 8 hours / month</text>
  <text x="75" y="325" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Best for: Experienced Linux engineers</text>

  <!-- Column 2: Managed VPS -->
  <rect x="500" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="500" y="125" width="410" height="40" rx="12" fill="#059669"/>
  <text x="705" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Managed VPS (Turnkey Infrastructure)</text>
  <text x="525" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• All-inclusive pricing ($35 - $65/mo)</text>
  <text x="525" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Bundled licenses: cPanel &amp; WHM, automated updates</text>
  <text x="525" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• 24/7 proactive monitoring, security updates, offsite backups</text>
  <text x="525" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Zero engineering overhead; instant SLA support</text>
  <text x="525" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Best for: Agencies, e-commerce, &amp; growing hosts</text>
</svg>
