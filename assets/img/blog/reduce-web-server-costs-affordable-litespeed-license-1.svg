<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cost Reduction with LiteSpeed Web Server</title>
  <desc id="d">4 strategic levers to reduce hosting server overhead with affordable LiteSpeed licensing.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <rect x="50" y="45" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. Right-Size RAM and Compute</text>
  <text x="80" y="105" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Avoid expensive 32GB/64GB hardware upgrades</text>
  <text x="80" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">by serving traffic via event-driven kernel caching.</text>
  <rect x="80" y="145" width="130" height="26" rx="6" fill="#EFF6FF"/>
  <text x="145" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">50% Hardware Save</text>

  <rect x="500" y="45" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="530" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. Wholesale IP Licensing</text>
  <text x="530" y="105" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Access genuine LiteSpeed 2-Core at $4.00/mo</text>
  <text x="530" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">instead of paying $10.00/mo retail vendor rates.</text>
  <rect x="530" y="145" width="130" height="26" rx="6" fill="#EFF6FF"/>
  <text x="595" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">60% License Save</text>

  <rect x="50" y="225" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. Eliminate External Caching Nodes</text>
  <text x="80" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Remove complex standalone Varnish/Nginx</text>
  <text x="80" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">proxies and manage caching from one engine.</text>
  <rect x="80" y="325" width="130" height="26" rx="6" fill="#EFF6FF"/>
  <text x="145" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">Simpler Architecture</text>

  <rect x="500" y="225" width="410" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="530" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Multi-Software Combo Deals</text>
  <text x="530" y="285" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">Stack LiteSpeed with cPanel and CloudLinux</text>
  <text x="530" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">for maximal cumulative monthly discounts.</text>
  <rect x="530" y="325" width="130" height="26" rx="6" fill="#ECFDF5"/>
  <text x="595" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Stack Discounts</text>
</svg>