<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg5)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Reseller Hosting Margin Model: Revenue vs. Upstream COGS</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Calculating gross margins, software overhead, payment fees, and monthly net profit</text>

  <!-- Metric 1: Monthly Inflow -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Client Revenue (MRR)</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">50 Clients @ $10/mo</text>
  <text x="75" y="225" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$500.00 / mo</text>
  <text x="75" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Starter plan: 10GB / 1 Domain</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Pro plan: 25GB / 3 Domains</text>
  <text x="75" y="325" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Target ARPU: $8 - $15/mo</text>

  <!-- Metric 2: Upstream Costs -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#b91c1c"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">COGS &amp; Software Licenses</text>
  <text x="375" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">Upstream Reseller / VPS: $25</text>
  <text x="375" y="225" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">cPanel Wholesale: $15</text>
  <text x="375" y="255" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">WHMCS Automation: $10</text>
  <text x="375" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Gateway Fees (3%): $15</text>
  <text x="375" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Total Costs: $65.00 / mo</text>

  <!-- Metric 3: Net Profit -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#0284c7"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Net Monthly Profit</text>
  <text x="675" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Gross Margin: 87%</text>
  <text x="675" y="235" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">+$435.00 / mo</text>
  <text x="675" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Annual Profit: $5,220.00</text>
  <text x="675" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Low Churn with WHMCS</text>
  <text x="675" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">High Recurring Scalability</text>
</svg>
