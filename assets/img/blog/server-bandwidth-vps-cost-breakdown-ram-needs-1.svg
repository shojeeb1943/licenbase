    <rect width="205" height="6" rx="3" fill="#F59E0B"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">High-Traffic Shop</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#F59E0B">8 GB RAM</text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
