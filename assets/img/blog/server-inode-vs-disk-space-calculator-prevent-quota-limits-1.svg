<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg10)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Disk Space (Gigabytes) vs. Inode Usage (File Count)</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Understanding why servers fail with "No space left on device" even when 50GB of free disk remains</text>

  <!-- Left: Disk Space -->
  <rect x="50" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="410" height="40" rx="12" fill="#0284c7"/>
  <text x="255" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Storage Capacity (Bytes / Gigabytes)</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• Measured with: <code>df -h</code></text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Represents physical size of files on disk media</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Consumed by video files, raw backups, large databases</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Example: A single 10 GB ISO consumes only 1 Inode</text>
  <text x="75" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Volume Storage Metric</text>

  <!-- Right: Inode Count -->
  <rect x="500" y="125" width="410" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="500" y="125" width="410" height="40" rx="12" fill="#b91c1c"/>
  <text x="705" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Inode Table Entries (Index Nodes / File Count)</text>
  <text x="525" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• Measured with: <code>df -i</code></text>
  <text x="525" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Represents number of discrete files, folders &amp; symlinks</text>
  <text x="525" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Exhausted by: PHP session files, cache folders, mail spool</text>
  <text x="525" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• 1,000,000 1KB session files = 1GB disk, but 100% Inodes!</text>
  <text x="525" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">File System Allocation Limit</text>
</svg>
