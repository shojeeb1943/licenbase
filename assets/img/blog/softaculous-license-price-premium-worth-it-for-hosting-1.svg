<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t5 d5">
  <title id="t5">Softaculous Free vs Premium License Feature Comparison</title>
  <desc id="d5">Comparison of application install counts, WordPress staging, and automated updates between Free and Premium Softaculous.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="60" y="40" width="400" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="85" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Softaculous Free Edition</text>
  <text x="85" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Limited Trial Environment</text>
  <path d="M85 120 h350" stroke="#F1F5F9" stroke-width="1"/>
  <text x="85" y="150" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Only 50 scripts available out of 450+</text>
  <text x="85" y="185" font-family="Inter, sans-serif" font-size="13" fill="#475569">• No automated script version upgrades</text>
  <text x="85" y="220" font-family="Inter, sans-serif" font-size="13" fill="#475569">• No WordPress 1-click clone or staging</text>
  <text x="85" y="255" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Basic backup options without remote cloud</text>
  <text x="85" y="290" font-family="Inter, sans-serif" font-size="13" fill="#475569">• Lacks automated plugin/theme updates</text>
  <rect x="85" y="320" width="350" height="36" rx="8" fill="#F1F5F9"/>
  <text x="260" y="343" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Restricted Feature Set</text>

  <rect x="500" y="40" width="400" height="340" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="525" y="75" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Softaculous Premium Edition</text>
  <text x="525" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#059669">Full Production Suite ($1.50/mo)</text>
  <path d="M525 120 h350" stroke="#F1F5F9" stroke-width="1"/>
  <text x="525" y="150" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• 450+ 1-click installation packages</text>
  <text x="525" y="185" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Automated vulnerability patching &amp; auto-upgrades</text>
  <text x="525" y="220" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Complete WordPress Manager (Staging &amp; Cloning)</text>
  <text x="525" y="255" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Remote automated backups to Google Drive / S3</text>
  <text x="525" y="290" font-family="Inter, sans-serif" font-size="13" fill="#1E293B">• Multi-control panel integration (cPanel, Plesk, etc.)</text>
  <rect x="525" y="320" width="350" height="36" rx="8" fill="#ECFDF5"/>
  <text x="700" y="343" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Essential for Hosting Providers</text>
</svg>