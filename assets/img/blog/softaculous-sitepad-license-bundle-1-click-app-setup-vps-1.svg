<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg1)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Softaculous &amp; SitePad Automation Architecture on VPS</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Unified 1-click script deployment and drag-and-drop website builder publishing directly to cPanel</text>

  <!-- Box 1: Softaculous Engine -->
  <rect x="50" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="50" y="125" width="260" height="40" rx="12" fill="#0284c7"/>
  <text x="180" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Softaculous Auto-Installer</text>
  <text x="75" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">450+ 1-Click Web Apps</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• WordPress, Joomla, Laravel</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated staging &amp; cloning</text>
  <text x="75" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated security backups</text>
  <text x="75" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zero Script Maintenance</text>

  <!-- Arrow 1 -->
  <path d="M 315 240 L 345 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Box 2: SitePad Website Builder -->
  <rect x="350" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="350" y="125" width="260" height="40" rx="12" fill="#059669"/>
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SitePad Site Builder</text>
  <text x="375" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">800+ Responsive Themes</text>
  <text x="375" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Drag-and-drop visual editor</text>
  <text x="375" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Publishes static HTML/CSS</text>
  <text x="375" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Zero database security risks</text>
  <text x="375" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pure Client-Side Speed</text>

  <!-- Arrow 2 -->
  <path d="M 615 240 L 645 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Box 3: cPanel / WHM Integration -->
  <rect x="650" y="125" width="260" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="650" y="125" width="260" height="40" rx="12" fill="#d97706"/>
  <text x="780" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Target VPS Environment</text>
  <text x="675" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Turnkey Client Retention</text>
  <text x="675" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Direct cPanel SSO integration</text>
  <text x="675" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated wholesale IP licenses</text>
  <text x="675" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Drastically cuts churn rates</text>
  <text x="675" y="325" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">High-Margin Reseller Stack</text>
</svg>
