<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg8)"/>
  <rect x="20" y="20" width="920" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Linux Incident Response: Malicious IP Triage &amp; Abuse Reporting</text>
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Detecting brute-force attacks in auth.log, looking up ASN contacts, and submitting verified RFC complaints</text>

  <!-- Step 1: Detect Attack -->
  <rect x="50" y="125" width="250" height="230" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="50" y="125" width="250" height="40" rx="12" fill="#b91c1c"/>
  <text x="175" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1. Detect Attack Pattern</text>
  <text x="75" y="195" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• SSH: Failed password attempts</text>
  <text x="75" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• HTTP: wp-login.php brute force</text>
  <text x="75" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Mail: Port 25 relay scanning</text>
  <text x="75" y="285" fill="#f8fafc" font-family="monospace" font-size="12">grep 'Failed password' /var/log/secure</text>
  <text x="75" y="325" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Isolate Offending IP</text>

  <!-- Arrow -->
  <path d="M 310 240 L 360 240" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 2: WHOIS & ASN Lookup -->
  <rect x="370" y="125" width="250" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="370" y="125" width="250" height="40" rx="12" fill="#d97706"/>
  <text x="495" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2. ASN &amp; Abuse WHOIS</text>
  <text x="395" y="195" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13">• Query whois &amp; AbuseIPDB</text>
  <text x="395" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Locate abuse@upstream-isp.com</text>
  <text x="395" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Verify Autonomous System (ASN)</text>
  <text x="395" y="285" fill="#f8fafc" font-family="monospace" font-size="12">whois IP | grep -i abuse</text>
  <text x="395" y="325" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Identify Carrier Contact</text>

  <!-- Arrow -->
  <path d="M 630 240 L 680 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 3: Block & Report -->
  <rect x="690" y="125" width="220" height="230" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="690" y="125" width="220" height="40" rx="12" fill="#059669"/>
  <text x="800" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3. Block &amp; Report</text>
  <text x="710" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">• CSF Drop: csf -d IP "Brute"</text>
  <text x="710" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Imunify360 auto graylist</text>
  <text x="710" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Submit log evidence to NOC</text>
  <text x="710" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Automated AbuseIPDB API</text>
  <text x="710" y="325" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Threat Neutralized</text>
</svg>
