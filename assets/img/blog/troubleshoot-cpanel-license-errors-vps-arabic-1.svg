<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Troubleshooting cPanel License Errors on VPS Arabic Guide</title>
  <desc id="d">Actionable Arabic guide to diagnose and fix cPanel license expiration errors, IP validation issues, and firewall timeouts on Linux VPS servers.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>

  <!-- Top Title -->
  <rect x="35" y="25" width="890" height="60" rx="12" fill="#0F172A"/>
  <text x="55" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">دليل حل مشاكل ترخيص cPanel لخوادم VPS (2026)</text>
  <text x="735" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">حلول فورية بدون توقف</text>

  <!-- 4 Step Columns -->
  <g transform="translate(35, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#EFF6FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">01</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">أمر cpkeyclt</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">أمر التحديث الأساسي:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, monospace" font-size="10" fill="#64748B">/usr/local/cpanel/cpkeyclt</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• يرسل استعلام التحديث</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• يتصل بسيرفر الترخيص</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• يجدد التوكن المحلي</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#EFF6FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">تحديث الترخيص الفوري</text>
  </g>

  <g transform="translate(263, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#ECFDF5"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">02</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">منافذ الجدار الناري</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">فحص المنافذ الصادرة:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• فتح منفذ 873 (rSync)</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• فتح منفذ 443 (HTTPS)</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• ضبط ملف /etc/csf/csf.conf</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• إعادة تشغيل csf -r</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#ECFDF5"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">السماح بالاتصال الخارجي</text>
  </g>

  <g transform="translate(491, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#FEF3C7"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">03</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">تطابق عنوان IP</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">التحقق من IPv4:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, monospace" font-size="10" fill="#64748B">curl -4 ifconfig.me</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• التحقق من الآي بي الصادر</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• مطابقته مع حساب LicenBase</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• تحديث IP مجاناً عند التغيير</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#FEF3C7"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">تطابق IP السيرفر</text>
  </g>

  <g transform="translate(719, 105)">
    <rect width="210" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="16" fill="#F3E8FF"/>
    <text x="35" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">04</text>
    <text x="60" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">ضبط وقت الخادم</text>
    <path d="M20 70 h165" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="20" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1E293B">مزامنة NTP:</text>
    <text x="20" y="118" font-family="Inter, Segoe UI, monospace" font-size="10" fill="#64748B">chronyc makestep</text>
    <text x="20" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• تصحيح انحراف الوقت</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• حماية توكن الأمان</text>
    <text x="20" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">• تفادي أخطاء SSL الداخلية</text>
    <rect x="20" y="220" width="165" height="42" rx="8" fill="#F3E8FF"/>
    <text x="102" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">مزامنة التوقيت الذري</text>
  </g>
</svg>
