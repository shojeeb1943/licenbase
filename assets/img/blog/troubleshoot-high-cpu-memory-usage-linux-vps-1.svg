<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Linux VPS High CPU and Memory Troubleshooting Pipeline</title>
  <desc id="d2">Linux VPS system diagnostic pipeline showing top, vmstat, iotop, and MySQL processlist tracing runaway CPU and memory spikes.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Linux VPS: High CPU &amp; Memory Troubleshooting Gauntlet</text>
  <text x="730" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Diagnostic Pipeline</text>

  <!-- Step 1: Overall Load -->
  <g transform="translate(35, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#EF4444"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#EF4444">1. Load &amp; CPU Wait</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">vmstat &amp; uptime</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#EF4444">vmstat 1 5</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Key Metric</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">wa (IO Wait) vs us (User CPU)</text>
    </g>
    <g transform="translate(14, 215)">
      <rect width="182" height="50" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Diagnosis:</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Distinguish disk vs compute</text>
    </g>
  </g>

  <!-- Step 2: Process Hotspots -->
  <g transform="translate(262, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#F59E0B"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FBBF24">2. Process Hotspots</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">htop &amp; top</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">htop -s PERCENT_CPU</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Key Metric</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">PID user ownership &amp; RES RAM</text>
    </g>
    <g transform="translate(14, 215)">
      <rect width="182" height="50" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Diagnosis:</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Pinpoint rogue website/user</text>
    </g>
  </g>

  <!-- Step 3: Database Queries -->
  <g transform="translate(489, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#3B82F6"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#60A5FA">3. MySQL Queries</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">mytop &amp; processlist</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#60A5FA">SHOW FULL PROCESSLIST;</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Key Metric</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Copying to tmp table / Lock</text>
    </g>
    <g transform="translate(14, 215)">
      <rect width="182" height="50" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Diagnosis:</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Unindexed slow SQL queries</text>
    </g>
  </g>

  <!-- Step 4: Storage IO -->
  <g transform="translate(715, 104)">
    <rect width="210" height="280" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <rect width="210" height="6" rx="3" fill="#10B981"/>
    <text x="16" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#34D399">4. Disk Bottlenecks</text>
    <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">iotop &amp; iostat</text>
    <g transform="translate(14, 75)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Command</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#34D399">iotop -oPa</text>
    </g>
    <g transform="translate(14, 145)">
      <rect width="182" height="60" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Key Metric</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Disk write MB/s per daemon</text>
    </g>
    <g transform="translate(14, 215)">
      <rect width="182" height="50" rx="6" fill="#0F172A"/>
      <text x="10" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Resolution:</text>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#34D399">Tune swap &amp; Redis caching</text>
    </g>
  </g>
</svg>