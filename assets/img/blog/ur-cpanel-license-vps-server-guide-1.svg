<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t15 d15">
  <title id="t15">سستے cPanel لائسنس کا انتخاب کیسے کریں - مکمل VPS گائیڈ</title>
  <desc id="d15">پاکستان میں سستے cPanel VPS لائسنس کا موازنہ اور سرور آئی پی ایکٹیویشن مرحلہ۔</desc>
  <rect width="960" height="420" rx="16" fill="#0F172A"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="480" y="55" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700" fill="#38BDF8" text-anchor="middle">سستے cPanel لائسنس کا انتخاب: VPS سرور کے لیے مکمل رہنمائی</text>

  <!-- Solo Card -->
  <rect x="45" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="45" y="85" width="265" height="6" rx="3" fill="#38BDF8"/>
  <text x="177" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">cPanel Solo</text>
  <text x="177" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">1 اکاؤنٹ</text>
  <line x1="65" y1="175" x2="290" y2="175" stroke="#334155"/>
  <text x="270" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">سنگل ویب سائٹ یا ای کامرس</text>
  <text x="270" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">ڈویلپمنٹ اور ٹیسٹنگ سرور</text>
  <text x="270" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">مکمل سیکیورٹی اور اپڈیٹس</text>
  <rect x="65" y="305" width="225" height="40" rx="6" fill="#1E293B"/>
  <text x="177" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">LicenBase: $4.00/ماہانہ</text>

  <!-- Admin Card -->
  <rect x="345" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <rect x="345" y="85" width="265" height="6" rx="3" fill="#10B981"/>
  <text x="477" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#34D399" text-anchor="middle">cPanel Admin (بہترین انتخاب)</text>
  <text x="477" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle">5 اکاؤنٹس تک</text>
  <line x1="365" y1="175" x2="590" y2="175" stroke="#334155"/>
  <text x="570" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">سافٹ ویئر ایجنسیز اور کلائنٹس</text>
  <text x="570" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">مکمل WHM روٹ ایڈمن رسائی</text>
  <text x="570" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">مفت آٹو ایس ایس ایل سرٹیفکیٹ</text>
  <rect x="365" y="305" width="225" height="40" rx="6" fill="#10B981"/>
  <text x="477" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">LicenBase: $4.00/ماہانہ</text>

  <!-- Pro Card -->
  <rect x="645" y="85" width="265" height="280" rx="10" fill="#0F172A" stroke="#334155"/>
  <rect x="645" y="85" width="265" height="6" rx="3" fill="#818CF8"/>
  <text x="777" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">cPanel Pro</text>
  <text x="777" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#818CF8" text-anchor="middle">30 اکاؤنٹس تک</text>
  <line x1="665" y1="175" x2="890" y2="175" stroke="#334155"/>
  <text x="870" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">ری سیلر ہوسٹنگ کاروبار</text>
  <text x="870" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">سرور آئی پی پر فوری ایکٹیویشن</text>
  <text x="870" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="end">100% اصلی اور محفوظ فائلز</text>
  <rect x="665" y="305" width="225" height="40" rx="6" fill="#1E293B"/>
  <text x="777" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#818CF8" text-anchor="middle">LicenBase: $4.00/ماہانہ</text>
</svg>