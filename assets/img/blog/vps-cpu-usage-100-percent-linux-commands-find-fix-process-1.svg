<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t11 d11">
  <title id="t11">Linux VPS 100 Percent CPU Diagnostic Command Pipeline</title>
  <desc id="d11">Sequence of Linux terminal commands to diagnose, trace, and terminate runaway processes consuming 100 percent CPU.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="35" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="50" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. Overview</text>
  <text x="50" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">top / htop</text>
  <path d="M50 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="50" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Real-time CPU %</text>
  <text x="50" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Check load average</text>
  <text x="50" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Press 'P' to sort by CPU</text>
  <text x="50" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Identify top PID</text>
  <rect x="50" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="137" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Find Rogue PID</text>

  <rect x="260" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="275" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. Process Inspection</text>
  <text x="275" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">ps aux --sort=-%cpu</text>
  <path d="M275 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="275" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• View full command args</text>
  <text x="275" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Check executing user</text>
  <text x="275" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Trace PHP / MySQL thread</text>
  <text x="275" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Detect crypto miners</text>
  <rect x="275" y="315" width="175" height="36" rx="8" fill="#EFF6FF"/>
  <text x="362" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Inspect Process</text>

  <rect x="485" y="40" width="205" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="500" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. I/O &amp; Wait State</text>
  <text x="500" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#2563EB">vmstat / iotop</text>
  <path d="M500 115 h175" stroke="#F1F5F9" stroke-width="1"/>
  <text x="500" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Check %wa (I/O wait)</text>
  <text x="500" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• High disk queue length</text>
  <text x="500" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Runaway database queries</text>
  <text x="500" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Memory swapping trigger</text>
  <rect x="485" y="315" width="205" height="36" rx="8" fill="#EFF6FF"/>
  <text x="587" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Trace Bottleneck</text>

  <rect x="710" y="40" width="215" height="340" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="725" y="75" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Termination &amp; Fix</text>
  <text x="725" y="98" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#059669">kill -15 / kill -9</text>
  <path d="M725 115 h185" stroke="#F1F5F9" stroke-width="1"/>
  <text x="725" y="145" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Graceful SIGTERM (15)</text>
  <text x="725" y="175" font-family="Inter, sans-serif" font-size="12" fill="#475569">• Force kill runaway: kill -9</text>
  <text x="725" y="205" font-family="Inter, sans-serif" font-size="12" fill="#475569">• CloudLinux CPU throttle</text>
  <text x="725" y="235" font-family="Inter, sans-serif" font-size="12" fill="#475569">• LiteSpeed cache speedup</text>
  <rect x="725" y="315" width="185" height="36" rx="8" fill="#ECFDF5"/>
  <text x="817" y="338" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">CPU Normal (0-15%)</text>
</svg>