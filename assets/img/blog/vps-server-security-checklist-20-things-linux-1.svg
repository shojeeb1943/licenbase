<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">20-Step Linux VPS Security & Hardening Architecture</title>
  <desc id="d">Comprehensive server security framework covering SSH, firewall, intrusion prevention, and WAF.</desc>
  <rect width="960" height="420" rx="20" fill="#F8FAFC"/>
  
    <!-- Box 1: 1. Access Security -->
    <rect x="35" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="35" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="35" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="51" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">1. Access Security</text>
    <rect x="51" y="105" width="175" height="26" rx="6" fill="#EFF6FF"/>
    <text x="61" y="122" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SSH & ACCOUNTS</text>
    <text x="51" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• ED25519 SSH keys</text><text x="51" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Disable root password SSH</text><text x="51" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Change standard port</text><text x="51" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Enforce sudo privileges</text>
        
    <!-- Box 2: 2. Network Defense -->
    <rect x="262" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="262" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="262" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="278" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">2. Network Defense</text>
    <rect x="278" y="105" width="175" height="26" rx="6" fill="#F0FDF4"/>
    <text x="288" y="122" fill="#16A34A" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">FIREWALL & FILTERS</text>
    <text x="278" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• UFW / Firewalld rules</text><text x="278" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Fail2ban brute-force jail</text><text x="278" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Block abusive ASN ranges</text><text x="278" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Secure open ports</text>
        
    <!-- Box 3: 3. OS Hardening -->
    <rect x="489" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="489" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="489" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="505" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">3. OS Hardening</text>
    <rect x="505" y="105" width="175" height="26" rx="6" fill="#FAF5FF"/>
    <text x="515" y="122" fill="#9333EA" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PATCHES & AUDITING</text>
    <text x="505" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Unattended security updates</text><text x="505" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Mount /tmp noexec,nosuid</text><text x="505" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Audit with Lynis scanner</text><text x="505" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Disable unused protocols</text>
        
    <!-- Box 4: 4. Active Defense -->
    <rect x="716" y="40" width="207" height="340" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="716" y="40" width="207" height="54" rx="14" fill="#F1F5F9"/>
    <rect x="716" y="80" width="207" height="14" fill="#F1F5F9"/>
    <text x="732" y="74" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">4. Active Defense</text>
    <rect x="732" y="105" width="175" height="26" rx="6" fill="#FFF7ED"/>
    <text x="742" y="122" fill="#EA580C" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">WAF & MALWARE</text>
    <text x="732" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Imunify360 real-time scan</text><text x="732" y="182" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• CloudLinux CageFS cage</text><text x="732" y="214" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• ModSecurity rulesets</text><text x="732" y="246" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">• Automated remote backup</text>
        
</svg>