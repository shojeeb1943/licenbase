<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bg8)"/>
  <text x="400" y="45" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" text-anchor="middle">VPS Incident Response: Investigating Malicious Traffic</text>
  <text x="400" y="72" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="13" text-anchor="middle">Analyzing SYN Floods, Outbound Spam, and Datacenter Abuse Reports</text>

  <rect x="40" y="105" width="220" height="270" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="140" fill="#f87171" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Threat Detection</text>
  <text x="150" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Spotting Traffic Anomalies</text>
  <line x1="60" y1="180" x2="240" y2="180" stroke="#334155"/>
  <text x="60" y="210" fill="#fca5a5" font-family="system-ui,-apple-system,sans-serif" font-size="12">• 100% Bandwidth spike</text>
  <text x="60" y="235" fill="#fca5a5" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Outbound Port 25 flood</text>
  <text x="60" y="260" fill="#fca5a5" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Thousands of SYN_RECV</text>
  <text x="60" y="285" fill="#fca5a5" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Datacenter abuse email</text>
  <rect x="60" y="325" width="180" height="32" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="150" y="346" fill="#f87171" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Abuse Alert Raised</text>

  <rect x="290" y="105" width="220" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="140" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. CLI Triage</text>
  <text x="400" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Isolating Offending PIDs</text>
  <line x1="310" y1="180" x2="490" y2="180" stroke="#334155"/>
  <text x="310" y="210" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• ss -tulpn | grep :80</text>
  <text x="310" y="235" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• netstat -ntu | awk</text>
  <text x="310" y="260" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• iftop / iptraf-ng</text>
  <text x="310" y="285" fill="#f8fafc" font-family="system-ui,-apple-system,sans-serif" font-size="12">• lsof -i :25</text>
  <rect x="310" y="325" width="180" height="32" rx="6" fill="#0284c7" fill-opacity="0.2"/>
  <text x="400" y="346" fill="#38bdf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Identify IP &amp; Script</text>

  <rect x="540" y="105" width="220" height="270" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="140" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Mitigation</text>
  <text x="650" y="165" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">Enforcing Firewall Rules</text>
  <line x1="560" y1="180" x2="740" y2="180" stroke="#334155"/>
  <text x="560" y="210" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">• csf -d IP_ADDRESS</text>
  <text x="560" y="235" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">• iptables -A INPUT -j DROP</text>
  <text x="560" y="260" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Terminate hijacked process</text>
  <text x="560" y="285" fill="#86efac" font-family="system-ui,-apple-system,sans-serif" font-size="12">• Imunify360 real-time scan</text>
  <rect x="560" y="325" width="180" height="32" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="650" y="346" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Server Protected</text>
</svg>