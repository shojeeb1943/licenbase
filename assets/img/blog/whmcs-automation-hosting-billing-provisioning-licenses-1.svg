<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t10 d10">
  <title id="t10">WHMCS Hosting Automation Provisioning and Billing Architecture</title>
  <desc id="d10">End-to-end workflow from customer checkout to automated server provisioning and license assignment.</desc>
  <rect width="960" height="420" rx="16" fill="#F8FAFC"/>
  <rect x="20" y="20" width="920" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="480" y="55" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">WHMCS Hosting Automation Lifecycle: Payment to Provisioning</text>

  <!-- Step 1: Customer Order -->
  <rect x="45" y="85" width="185" height="130" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="137" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">1. Client Order</text>
  <text x="137" y="140" font-family="Inter, sans-serif" font-size="12" fill="#3B82F6" text-anchor="middle">Selects VPS / cPanel</text>
  <text x="137" y="160" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Stripe / PayPal payment</text>
  <text x="137" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">Payment Confirmed</text>

  <!-- Arrow -->
  <path d="M230 150 L265 150" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 2: WHMCS Engine -->
  <rect x="270" y="85" width="195" height="130" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
  <text x="367" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="middle">2. WHMCS Core</text>
  <text x="367" y="140" font-family="Inter, sans-serif" font-size="12" fill="#7C3AED" text-anchor="middle">Invoice marked paid</text>
  <text x="367" y="160" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Triggers Server Module</text>
  <text x="367" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">Cron Automation</text>

  <!-- Arrow -->
  <path d="M465 150 L500 150" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 3: API Provisioning -->
  <rect x="505" y="85" width="195" height="130" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="602" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">3. Hypervisor / WHM</text>
  <text x="602" y="140" font-family="Inter, sans-serif" font-size="12" fill="#059669" text-anchor="middle">Virtualizor creates VPS</text>
  <text x="602" y="160" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">WHM creates cPanel acct</text>
  <text x="602" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Active in 60s</text>

  <!-- Arrow -->
  <path d="M700 150 L735 150" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 4: License Activation -->
  <rect x="740" y="85" width="180" height="130" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="830" y="115" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">4. License Sync</text>
  <text x="830" y="140" font-family="Inter, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">LicenBase API</text>
  <text x="830" y="160" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">IP authorized</text>
  <text x="830" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">Zero Manual Touch</text>

  <!-- Bottom Benefits Bar -->
  <rect x="45" y="245" width="875" height="130" rx="8" fill="#0F172A"/>
  <text x="75" y="275" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">Why Hosting Businesses Automate with WHMCS &amp; LicenBase:</text>
  <text x="75" y="305" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; Instant 24/7 provisioning without waiting for daytime staff intervention</text>
  <text x="75" y="330" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">&bull; Automated recurring credit card charges and suspension of unpaid invoices</text>
  <text x="75" y="355" font-family="Inter, sans-serif" font-size="13" fill="#6EE7B7">&bull; Wholesale licenses starting from $1.50/mo protect high gross profit margins</text>
</svg>