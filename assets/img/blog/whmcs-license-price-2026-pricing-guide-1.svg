    <text x="100" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">LicenBase Flat</text>
    <text x="100" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#34d399">$5.00/mo</text>
