    <text x="100" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#34d399">$5.00/mo</text>
    <text x="100" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981">Save $419/yr</text>
