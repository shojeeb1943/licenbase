  <rect width="960" height="500" rx="16" fill="url(#whmcs_bg)" />
  <rect x="2" y="2" width="956" height="496" rx="14" fill="none" stroke="#334155" stroke-width="2" />
  <text x="480" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">WHMCS 2026 License Tiers &amp; Client Quotas</text>
