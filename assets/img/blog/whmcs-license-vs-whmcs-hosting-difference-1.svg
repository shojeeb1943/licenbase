<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <rect width="960" height="500" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="956" height="496" rx="14" fill="none" stroke="#334155" stroke-width="2" />
  <text x="480" y="55" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#f8fafc">WHMCS Standalone License vs Reseller WHMCS Hosting</text>
  <text x="480" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">Comparing Infrastructure Independence, Portability, and Database Control</text>

  <!-- Left: Standalone License -->
  <g transform="translate(60, 130)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="195" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#60a5fa">Standalone License (Self-Hosted)</text>
    <line x1="20" y1="65" x2="370" y2="65" stroke="#334155" />
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#34d399">&#x2714; Full root server &amp; MySQL access</text>
    <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#34d399">&#x2714; Host on any cloud (Hetzner, AWS, OVH)</text>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#34d399">&#x2714; Install custom third-party modules</text>
    <text x="30" y="210" font-family="sans-serif" font-size="13" fill="#34d399">&#x2714; Zero reseller lock-in</text>
    <text x="30" y="245" font-family="sans-serif" font-size="13" fill="#34d399">&#x2714; Direct cron and Redis cache control</text>
    <rect x="20" y="260" width="350" height="35" rx="6" fill="#0f172a" />
    <text x="195" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Ideal for Growing Hosting Brands</text>
  </g>

  <!-- Right: Reseller Bundled WHMCS -->
  <g transform="translate(510, 130)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="195" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fbbf24">Reseller Bundled WHMCS</text>
    <line x1="20" y1="65" x2="370" y2="65" stroke="#334155" />
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#f87171">&#x274c; Tied exclusively to reseller host</text>
    <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#f87171">&#x274c; Cannot migrate without losing license</text>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#f87171">&#x274c; Restricted PHP / memory limits</text>
    <text x="30" y="210" font-family="sans-serif" font-size="13" fill="#cbd5e1">&#x2022; Included free in high-tier reseller plans</text>
    <text x="30" y="245" font-family="sans-serif" font-size="13" fill="#f87171">&#x274c; Starter tier limits apply (250 clients)</text>
    <rect x="20" y="260" width="350" height="35" rx="6" fill="#0f172a" />
    <text x="195" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">Limited to Beginner Resellers</text>
  </g>
</svg>