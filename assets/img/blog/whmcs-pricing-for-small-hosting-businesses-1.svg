    <line x1="20" y1="65" x2="370" y2="65" stroke="#334155" />
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#cbd5e1">WHMCS Starter (250 clients): $19.95/mo</text>
    <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#cbd5e1">cPanel Admin (5 accounts): $27.99/mo</text>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">Cloud VPS Compute: $15.00/mo</text>
    <line x1="20" y1="205" x2="370" y2="205" stroke="#334155" />
    <text x="30" y="240" font-family="sans-serif" font-size="15" font-weight="700" fill="#f87171">Total Monthly Baseline: $62.94 / mo</text>
    <text x="30" y="275" font-family="sans-serif" font-size="13" fill="#ef4444">Annual License Expense: $755.28 / yr</text>
  </g>

  <!-- Right: LicenBase Model -->
  <g transform="translate(510, 130)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="195" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#34d399">LicenBase Optimized Model</text>
    <line x1="20" y1="65" x2="370" y2="65" stroke="#334155" />
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#cbd5e1">WHMCS Unlimited: $5.00/mo</text>
    <text x="30" y="140" font-family="sans-serif" font-size="13" fill="#cbd5e1">cPanel VPS Unlimited: $4.00/mo</text>
    <text x="30" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">Cloud VPS Compute: $15.00/mo</text>
    <line x1="20" y1="205" x2="370" y2="205" stroke="#334155" />
    <text x="30" y="240" font-family="sans-serif" font-size="15" font-weight="700" fill="#34d399">Total Monthly Baseline: $24.00 / mo</text>
    <text x="30" y="275" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">Annual Total Savings: $467.28 (62% saved)</text>
