<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <rect width="960" height="500" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="956" height="496" rx="14" fill="none" stroke="#334155" stroke-width="2" />
  <text x="480" y="55" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Startup Hosting Unit Economics: Software Costs vs Revenue</text>
  <text x="480" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">How Affordable WHMCS Licensing Protects Cash Flow in the First 12 Months</text>

  <!-- Left: Retail Model -->
  <g transform="translate(60, 130)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
