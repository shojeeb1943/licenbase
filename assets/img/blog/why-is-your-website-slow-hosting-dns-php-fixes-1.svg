<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Website Latency Pipeline and Bottleneck Architecture</title>
  <desc id="d">Diagram illustrating the full request journey from DNS resolution to network transit, server TTFB, PHP worker execution, and database queries.</desc>
  <rect width="960" height="420" rx="20" fill="#0F172A"/>
  <rect x="35" y="24" width="890" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="55" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Website Speed Pipeline: Identifying Latency Bottlenecks</text>
  <text x="740" y="61" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">Performance Audit</text>

  <!-- 4 Bottlenecks -->
  <g transform="translate(35, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#EF4444"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">1. DNS Lookup</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#EF4444">100 - 300ms</text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Slow authoritative DNS</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Uncached domain queries</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Multi-hop resolver lag</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Fix: Premium anycast DNS</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#EF4444" text-anchor="middle">Network Entry</text>
  </g>

  <g transform="translate(263, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#F59E0B"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">2. Server TTFB</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#F59E0B">400 - 1500ms</text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Apache worker blocking</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Slow mechanical SATA disk</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• No page cache in RAM</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Fix: LiteSpeed + NVMe</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">Web Server Layer</text>
  </g>

  <g transform="translate(491, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#38BDF8"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">3. PHP Execution</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">200 - 800ms</text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Heavy unoptimized plugins</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Stale PHP 7.x runtime</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Saturated max_children</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Fix: Upgrade to PHP 8.3</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Application Code</text>
  </g>

  <g transform="translate(719, 104)">
    <rect width="205" height="280" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect width="205" height="6" rx="3" fill="#10B981"/>
    <text x="20" y="36" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">4. MySQL Queries</text>
    <text x="20" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#10B981">150 - 600ms</text>
    <path d="M20 80 h165" stroke="#334155" stroke-width="1"/>
    <text x="20" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Unindexed postmeta tables</text>
    <text x="20" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Expired autoload transients</text>
    <text x="20" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Insufficient buffer pool</text>
    <text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">• Fix: Redis Object Cache</text>
    <rect x="18" y="232" width="169" height="32" rx="8" fill="#0F172A"/>
    <text x="102" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">Database Layer</text>
  </g>
</svg>